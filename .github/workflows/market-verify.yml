# Assert the market reference data is not silently wrong.
#
# WHY THIS EXISTS. Landing N-PORT holdings surfaced four defects that produced NO error
# of any kind. The worst: SEC writes `<cusip>000000000</cusip>` to mean "no CUSIP", and
# 72% of holdings carry it — so treating it as an identifier collapsed Accenture, Seagate,
# TE Connectivity and NXP into a SINGLE security. Every request returned 200. The only
# visible symptom was one fund's weights summing to 97.1% instead of 100%.
#
# So the checks here are deliberately about SHAPE rather than exceptions. Silent corruption
# in this pipeline looks like plausible data with the wrong totals, and the way to catch it
# is to assert the totals.
#
# Reads only, with the ANON key — exactly what a visitor sees. If a check here fails on
# data the ingest reported as successful, the RLS or the schema cache is the suspect.
name: Market data verify

on:
  schedule:
    # 03:00 UTC — after the 02:10 warm-up has had time to land.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: market-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The health check below is a script in this repo, so the job needs the code. Every other
      # check is a bare curl, which is why this job never checked out before.
      - uses: actions/checkout@v7
      - name: Check market invariants
        env:
          BASE: "https://${{ vars.SUPABASE_SUBDOMAIN || 'supabase' }}.${{ vars.DOMAIN }}"
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          # Used ONLY for check 7b. The backlog views are internal — granted to service_role and
          # deliberately not to anon — so an invariant about them cannot be read as a visitor. Every
          # other check here stays on the anon key on purpose; see the header.
          SRV: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${ANON:-}" ]; then echo "::error::SUPABASE_ANON_KEY is not set"; exit 1; fi

          fail=0
          # PostgREST returns the row count in Content-Range with Prefer: count=exact, so a
          # count costs one request and no body.
          # WHY THE BODY IS KEPT. A count that comes back empty used to be reported as
          # "auth, schema cache, or service down" — a guess, and on 2026-08-13 the wrong one: the
          # real answer was `57014 canceling statement due to statement timeout`, because the run
          # overlapped a DEPLOY. Migrations re-apply in full on every deploy and migration 35 drops
          # and recreates the serving views, so an anon read taken at that moment blocks on their
          # locks until PostgREST gives up. service_role sailed through (BYPASSRLS), which made it
          # look like a grant problem and cost a round of probing.
          #
          # The body says which it is, and PostgREST always sends one, so keep it and print it.
          #
          # THROUGH A FILE, not a variable. `count` is always called as `$(count …)`, which runs it
          # in a SUBSHELL — an assignment there cannot reach the caller, so a `last_body` global
          # would read empty at exactly the moment it is wanted. A file outlives the subshell.
          BODY=/tmp/market-verify-last-body
          count() {
            curl -sS --max-time 60 -D /tmp/market-verify-hdr -o "$BODY" "$BASE/rest/v1/$1" \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
              -H 'Accept-Profile: market' -H 'Prefer: count=exact' -H 'Range: 0-0' 2>/dev/null
            tr -d '\r' < /tmp/market-verify-hdr | awk -F'/' '/^[Cc]ontent-[Rr]ange:/ {print $2}'
          }
          last_body() { head -c 200 "$BODY" 2>/dev/null || echo '<no body>'; }
          check_min() { # name, actual, floor
            if [ -z "${2:-}" ] || [ "$2" = "*" ]; then
              echo "::error::$1 — could not read a count: $(last_body)"; fail=1; return
            fi
            if [ "$2" -lt "$3" ]; then
              echo "::error::$1 = $2, expected at least $3"; fail=1
            else
              echo "  ok   $1 = $2 (floor $3)"
            fi
          }
          check_zero() {
            if [ -z "${2:-}" ] || [ "$2" = "*" ]; then
              echo "::error::$1 — could not read a count: $(last_body)"; fail=1; return
            fi
            if [ "$2" -ne 0 ]; then echo "::error::$1 = $2, expected 0"; fail=1
            else echo "  ok   $1 = 0"; fi
          }

          # 1. The universe exists and is the size fund holdings actually produce. A floor
          #    catches the collapse case: the placeholder-CUSIP bug merged thousands of
          #    securities into hundreds while every request still returned 200.
          check_min "securities"  "$(count 'security?select=security_id')"            5000
          check_min "identifiers" "$(count 'security_identifier?select=value')"       8000
          check_min "holdings"    "$(count 'fund_holding?select=fund_id')"           12000
          check_min "issuers"     "$(count 'issuer?select=issuer_id')"                3000

          #    The total is NOT a proxy for the equity universe, and since securities are typed from
          #    the filing's `assetCat` it is less of one than ever: bonds outnumber equities here
          #    (15,205 vs 12,348 when the typing landed). Every backlog and every serving view
          #    filters `security_type_code = 'equity'`, so a bug that retyped equities would empty
          #    the app while leaving the total — and check 1 — completely untouched.
          check_min "equities"    "$(count 'security?select=security_id&security_type_code=eq.equity')" 9000

          # 2. No placeholder ever becomes an identifier again. This is the exact value that
          #    caused the merge, asserted directly.
          check_zero "all-zero CUSIPs" "$(count 'security_identifier?select=value&kind_code=eq.cusip&value=eq.000000000')"
          check_zero "all-zero ISINs"  "$(count 'security_identifier?select=value&kind_code=eq.isin&value=eq.000000000000')"

          # 3. ISIN coverage. Measured at 98%+; a sharp drop means parsing broke — and note
          #    that identifiers are XML ATTRIBUTES, so reading them as element text yields
          #    empty strings and loses every one of them without erroring.
          check_min "ISIN identifiers" "$(count 'security_identifier?select=value&kind_code=eq.isin')" 7000

          # 4. The funds are actually being tracked and were ingested.
          check_min "enabled tracked funds" "$(count 'tracked_fund?select=symbol&enabled=eq.true')" 30
          check_min "funds ingested"        "$(count 'tracked_fund?select=symbol&last_report_date=not.is.null')" 30

          # 5. The SERVING VIEWS the app reads. A view can exist in Postgres and still be
          #    invisible over the API — PostgREST caches the schema, and a missing grant or a
          #    stale cache both present as "relation does not exist" to the client while every
          #    psql query looks fine. This is the check that says the UI can actually read it.
          check_min "sector_constituents (view, as anon)" "$(count 'sector_constituents?select=security_id')" 400
          check_min "security_current (view, as anon)"    "$(count 'security_current?select=security_id')"   5000
          check_min "fund_sector_weight (view, as anon)"  "$(count 'fund_sector_weight?select=fund_symbol')"   30

          # 6. Ticker resolution is incremental, so this is a PROGRESS check rather than a floor
          #    on the final state — it fails only if resolution has produced essentially nothing.
          check_min "resolved tickers" "$(count 'security_identifier?select=value&kind_code=eq.ticker')" 100

          # 7. NO DUPLICATE constituents. `security_taxonomy` is many-to-many over sources on
          #    purpose, so a security classified by both a filing and a provider appeared TWICE in
          #    the sector list and was counted twice in the donut. The views now pick by source
          #    priority; this asserts they still do, by comparing one sector's row count against
          #    its DISTINCT security count.
          # Compared within a BOUNDED WINDOW, deliberately. The first version of this check
          # counted all rows with `Prefer: count=exact` and compared that against the ids in the
          # response body — but PostgREST caps a response at PGRST_DB_MAX_ROWS (1000 here), so it
          # was comparing 1,052 against a truncated page of 1,000 and reporting duplicates that did
          # not exist. Ordering by security_id puts any real duplicate adjacent, so a window under
          # the cap still finds one.
          dupes=$(curl -sS --max-time 60 \
            "$BASE/rest/v1/sector_constituents?select=security_id&sector_id=eq.information-technology&order=security_id&limit=900" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H 'Accept-Profile: market' \
            | tr ',' '\n' | grep -oE '"security_id":"[^"]+"' | sort | uniq -d | wc -l | tr -d ' ')
          if [ "${dupes:-1}" -ne 0 ]; then
            echo "::error::sector_constituents has $dupes duplicated securities in a 900-row window"
            fail=1
          else
            echo "  ok   sector_constituents has no duplicates (900-row window)"
          fi

          # 7b. A BACKLOG MUST BE SATISFIABLE. `pending_industry` asked "has a sector, has no
          #     industry" but expressed the second half as a left join plus `where … is null`,
          #     which filters ROWS rather than securities — so a security kept qualifying through
          #     its own level-1 sector rows and could never leave. Measured 2026-08-11: AMZN was
          #     classified and returned by the backlog in the same minute; the count sat at 7,911
          #     across a run reporting `classified: 282`; 345 securities had an industry against
          #     8,412 with a sector, because the resource re-fetched the same top-300 forever.
          #     A resource that reports success and progress while writing the same rows is
          #     invisible in every other check here, so it is asserted directly: nothing already
          #     classified may still be queued.
          #     100 ids, not 900 — an `in.()` filter is a URL, and ~6.5 KB earns a bare 502.
          if [ -z "${SRV:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set — the backlog check cannot run"
            fail=1
          else
            head_ids=$(curl -sS --max-time 60 \
              "$BASE/rest/v1/pending_industry?select=security_id&order=best_weight.desc&limit=100" \
              -H "apikey: $SRV" -H "Authorization: Bearer $SRV" -H 'Accept-Profile: market' \
              | grep -oE '"security_id":"[^"]+"' | cut -d'"' -f4 | paste -sd, -)
            if [ -z "${head_ids:-}" ]; then
              echo "  ok   pending_industry is empty — every classified security has an industry"
            else
              queued_but_done=$(count "security_taxonomy?select=security_id,taxonomy_node!inner(level)&taxonomy_node.level=eq.2&security_id=in.($head_ids)")
              check_zero "queued for an industry but already classified" "$queued_but_done"
            fi
          fi

          # 7c. NO FABRICATED TOTAL LOSS. `returnsFor` guards a zero DENOMINATOR but not the
          #     numerator, and `Number.isFinite(0)` is true — so a provider bar with `close: 0`
          #     as the latest point made every period compute `(0 / from - 1)` = exactly -100%.
          #     Measured 2026-08-11: 1,078 of 20,399 rows, i.e. 154 securities each showing -100%
          #     on ALL SEVEN periods including `1d`. A security cannot fall 100% in a day and also
          #     100% over a year. They cluster in late timezones (India 50, Taiwan 36, mainland
          #     China 34, Hong Kong 8) — an untraded session, not 154 bankruptcies.
          #     Zero bars are now dropped at parse, so exactly -100% is unreachable rather than
          #     merely unlikely: producing it requires a latest close of 0, which no longer enters.
          check_zero "instrument returns at exactly -100%" \
            "$(count 'performance?select=scope_id&scope=eq.instrument&change_pct=eq.-100')"

          # 7d. IMPLAUSIBLE RETURNS ARE BOUNDED, not banned. A large return is not by itself wrong:
          #     of the 40 securities returning >= +300% (measured 2026-08-12), 34 were real — SNDK
          #     +2,692%, MU +580% — and only 6 were artifacts of a unit change or an unadjusted
          #     corporate action. So this is a TRIPWIRE on the count, not an assertion that no
          #     number may be large: `returnsFor` now drops any period spanning a >5x single-day
          #     move, so the artifact population should stay near zero while the real one persists.
          #     A jump here means either a new redenomination (Tel Aviv switched ILS->agorot on
          #     2026-05-18 and took two securities to ~+9,000%) or that the break detection stopped
          #     working. Both are worth a look; neither is an emergency.
          extreme=$(count 'performance?select=scope_id&scope=eq.instrument&period=eq.1y&change_pct=gte.1000')
          if [ -z "${extreme:-}" ]; then
            echo "::error::extreme returns — could not read a count"; fail=1
          elif [ "$extreme" -gt 25 ]; then
            echo "::error::$extreme securities report a 1y return >= +1000% (was 19, of which 6 were unit changes now removed) — check for a new redenomination"
            fail=1
          else
            echo "  ok   extreme 1y returns = $extreme (tripwire at 25)"
          fi

          # 7e. A RESOURCE THAT HAS STOPPED WORKING. Every other check here asserts the SHAPE of
          #     the data, which cannot see a resource failing on every run — the table simply stops
          #     growing and a floor below the current value stays green for weeks. Both failures
          #     found on 2026-08-12 were exactly that: a currency foreign key and a missing grant,
          #     each breaking a resource completely while every count stayed plausible.
          #     The threshold logic lives in a script, not inline here, because it needs real dates
          #     and a workflow is a bad place to keep something worth testing.
          health=$(curl -sS --max-time 60 "$BASE/rest/v1/refresh_log?select=resource,started_at,finished_at,ok,error" \
            -H "apikey: $SRV" -H "Authorization: Bearer $SRV" -H 'Accept-Profile: market' \
            | python3 .github/scripts/check_resource_health.py) && rc=0 || rc=1
          if [ "$rc" -ne 0 ]; then
            echo "::error::$health"; fail=1
          else
            echo "  ok   $health"
          fi

          # 7f. NOTHING IS PERFECTLY FLAT. A delisted instrument keeps being served by the price
          #     provider — the same final bars forever — so every period is measured between two
          #     identical closes and comes back as exactly +0.0%. That reads as "the market was
          #     flat", not "this fund is dead". Measured 2026-08-13: Egypt, Nigeria and Portugal
          #     each showed +0.0% on all nine periods, dated that day, from ETFs whose last SEC
          #     filing was 2022, 2023 and 2024.
          #     A real 0.00% over a year is vanishingly unlikely; over 1d it is merely rare, so this
          #     counts the LONG periods only.
          flat=$(count 'performance?select=scope_id&period=in.(1y,6m,3m)&change_pct=eq.0')
          if [ -z "${flat:-}" ]; then
            echo "::error::flat-return check — could not read a count"; fail=1
          elif [ "$flat" -gt 5 ]; then
            echo "::error::$flat returns are exactly 0.00% over 3m/6m/1y — a delisted instrument is being priced off its final bars"
            fail=1
          else
            echo "  ok   exactly-flat long returns = $flat (tripwire at 5)"
          fi

          # 7g. A MEGA-CAP IS NEVER UNANSWERABLE. This is the check that was missing on 2026-08-13,
          #     when an over-eager drain tripped yfinance's rate limit and ~8,300 securities were
          #     recorded as permanently unanswerable. A throttled yfinance answers 200-WITH-NO-ROWS
          #     rather than erroring, so every outage rule — all of them THROW checks — stayed
          #     quiet, and `pending_industry` went to 0 and read as DRAINED.
          #
          #     WHAT WAS TRIED AND REJECTED. "Marked a lot today while classifying little" is the
          #     natural formulation and it does not work: measured on the real incident, the day
          #     classified 2,020 securities WHILE marking 1,732, because the outage was a
          #     thirty-minute window inside a productive day. Any day-granularity comparison is
          #     blind to it, and a version of this check written that way passed on the very data
          #     it was meant to catch.
          #
          #     ABSURDITY IS THE SIGNAL INSTEAD, and it is unmissable: 109 of 213 US mega-caps were
          #     marked no-industry, 152 marked no-statements. INTC, PEP, XOM, TXN, EA, SCCO, EQH,
          #     REGN, UPS. Derived from market cap rather than an authored ticker list so it
          #     maintains itself, and restricted to US securities because `market_cap` is stored in
          #     each security's own currency and only becomes comparable within one.
          for col in industry_missing_at statements_missing_at performance_missing_at; do
            big=$(count "security?select=security_id&country_iso2=eq.US&market_cap=gt.50000000000")
            bad=$(count "security?select=security_id&country_iso2=eq.US&market_cap=gt.50000000000&$col=not.is.null")
            if [ -z "${big:-}" ] || [ -z "${bad:-}" ]; then
              echo "::error::mega-cap check ($col) — could not read a count: $(last_body)"; fail=1
            elif [ "$big" -lt 100 ]; then
              echo "::error::only $big US mega-caps have a market cap — the cap refresh has stopped"; fail=1
            elif [ "$bad" -gt 20 ]; then
              echo "::error::$bad of $big US mega-caps carry $col — a provider refusal is being recorded as dead securities"
              fail=1
            else
              echo "  ok   US mega-caps carrying $col = $bad of $big (tripwire at 20)"
            fi
          done

          # 8. NO COUNTRY SILENTLY DROPPED. Taiwan had 534 securities and zero provider symbols
          #    because OpenFIGI returns `exchCode` bare for some venues and labelled for others
          #    ("KS" vs "TT (Taiwan Stock Exchange)"), so an exact match resolved Korea and dropped
          #    Taiwan with no error anywhere. A country with securities but no symbols at all is
          #    that signature, and nothing else looks like it.
          for iso in TW KR JP IN HK BR AU; do
            secs=$(count "security?select=security_id&country_iso2=eq.$iso&security_type_code=eq.equity")
            syms=$(count "security_provider_symbol?select=symbol,security!inner(country_iso2)&security.country_iso2=eq.$iso")
            if [ "${secs:-0}" -gt 20 ] && [ "${syms:-0}" -eq 0 ]; then
              echo "::error::$iso has $secs securities and NO provider symbols — silently dropped"
              fail=1
            else
              echo "  ok   $iso: $secs securities, $syms provider symbols"
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::market reference data failed verification — see the failures above"
            exit 1
          fi
          echo "all market invariants hold"
