name: Quality

# The merge gate for this repo. Until now nothing checked a pull request here:
# deploy.yml only fires on workflow_dispatch / repository_dispatch, so a
# malformed .tf or a broken playbook task was discoverable only by running a
# deploy against the live Oracle node — which is also the thing that once
# replaced the VM and wiped every database.
#
# Everything below runs WITHOUT credentials and WITHOUT touching real infra:
# `terraform init -backend=false` skips the OCI Object Storage backend, and
# `ansible-playbook --syntax-check` needs no inventory or SSH key.
#
# NOTE: deliberately NO `paths` / `paths-ignore` filter. This is a REQUIRED
# status check, and a filtered workflow never reports on a PR that misses the
# filter — leaving the PR blocked on a check that will never arrive.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # PARSE the Swarm stack template, don't eyeball it.
  #
  # A one-line volume mount was inserted mid-`environment:` because the anchor it was placed after
  # was unique but not the END of its block — which orphaned two env keys under `volumes:` and
  # failed the deploy with `yaml: line 603: did not find expected '-' indicator`. Nothing in CI
  # looked at this file, so a syntax error in the thing that defines every service reached the node.
  #
  # Jinja is stripped rather than rendered: the values do not matter, the STRUCTURE does.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Parse the stack template
        run: |
          python - <<'PY'
          import re, sys, yaml
          raw = open('stack/docker-compose.yaml').read()
          rendered = re.sub(r'\{%.*?%\}', '', re.sub(r'\{\{.*?\}\}', 'x', raw, flags=re.S), flags=re.S)
          try:
              doc = yaml.safe_load(rendered)
          except yaml.YAMLError as e:
              print(f"::error::stack/docker-compose.yaml is not valid YAML: {e}")
              sys.exit(1)
          services = doc.get('services') or {}
          if not services:
              print("::error::no services parsed — the template rendered to something unexpected")
              sys.exit(1)
          # A service whose `environment` came back as anything but a mapping means a block was
          # split, which is the exact failure above and is otherwise invisible.
          bad = [n for n, s in services.items()
                 if 'environment' in s and not isinstance(s['environment'], (dict, list))]
          if bad:
              print(f"::error::malformed `environment` in: {', '.join(bad)}")
              sys.exit(1)
          print(f"ok  {len(services)} services parsed")
          PY

  # BOOT THE ORCHESTRATOR, DO NOT MERELY PARSE IT.
  #
  # Six defects reached production in PR #343 and its follow-ups, and every one was the FIRST
  # EXECUTION of a new task or a new container. Because Ansible halts at the first failure, each
  # deploy could reveal exactly ONE of them: three failed deploys, 19 + 28 + 17 minutes, one bug
  # each. Two more sat PAST the failure point, so no deploy would ever have reported them — they
  # surfaced only when someone drove Dagster by hand afterwards.
  #
  # Nothing here could have caught them, and the reason is uniform: every gate checks SHAPE.
  # `compose` parses the template, `ansible` runs --syntax-check, `terraform` runs validate,
  # `migrations` applies SQL — and the three services, their commands and their read-only config
  # mount were executed for the first time on the node.
  #
  # This job starts them. It would have caught:
  #   * `dagster-daemon run` with no `-w`, which exits 1 with "no [tool.dagster] block in
  #     pyproject.toml" — a message that points at the image and means the daemon has no code
  #     location
  #   * Dagster's telemetry writing `.telemetry` into a DAGSTER_HOME that is mounted READ-ONLY,
  #     which crash-looped the daemon
  #   * `dagster-webserver` missing from the image entirely (also now checked in muffin-ingest CI)
  #
  # WHAT IT DELIBERATELY DOES NOT REPRODUCE: `postgres` being a NON-SUPERUSER, which is what made
  # `create database dagster owner dagster` fail with `must be able to SET ROLE "dagster"`. That is
  # a property of the `supabase/postgres` image, and pulling it here would add gigabytes to every
  # PR for one statement. The static check in the `ansible` job covers that pairing instead. Said
  # out loud because a job that implies coverage it does not have is worse than a missing one.
  dagster-boots:
    # ARM64 IS NOT OPTIONAL. `muffin-ingest` is built linux/arm64 only, because the Oracle node is
    # aarch64 — an ubuntu-latest runner cannot execute the image at all.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Take the commands from the stack template, never from a copy of them
        # The whole point is to run what the node runs. Restating the commands here would make
        # this a test of a second copy, and the copy that drifts is always the one nobody reads.
        run: |
          python - <<'PY' > /tmp/boot.sh
          import re, yaml
          raw = open('stack/docker-compose.yaml').read()
          rendered = re.sub(r'\{%.*?%\}', '', re.sub(r'\{\{.*?\}\}', 'PLACEHOLDER', raw, flags=re.S), flags=re.S)
          doc = yaml.safe_load(rendered)
          image = 'ghcr.io/gururafiki/muffin-ingest:latest'
          lines = ['set -euo pipefail']
          for name in ('muffin-ingest', 'dagster-daemon', 'dagster-webserver'):
              svc = doc['services'][name]
              cmd = ' '.join(svc['command'])
              mount = [v for v in svc['volumes'] if v.endswith(':ro')][0]
              # The mount is the STAGED directory on the node; here it is the repo's copy of the
              # same two files, still read-only — which is the condition telemetry died on.
              mount = mount.replace('/home/ubuntu/dagster', '$PWD/stack/dagster')
              lines.append(
                  f'docker run -d --name {name} --network muffin-ci '
                  f'-e DAGSTER_HOME=/opt/dagster/home -e DAGSTER_PG_PASSWORD=ci-password '
                  f'-e INGEST_DATABASE_URL=postgresql://postgres:ci-password@supabase-db:5432/postgres '
                  f'-v {mount} {image} {cmd}'
              )
          print('\n'.join(lines))
          PY
          cat /tmp/boot.sh
      - name: A database for Dagster to store its runs in
        # Plain postgres, NOT supabase/postgres — see the note above about what this does not
        # reproduce. `dagster.yaml` names the host `supabase-db`, so the container is named for it.
        run: |
          docker network create muffin-ci
          docker run -d --name supabase-db --network muffin-ci \
            -e POSTGRES_PASSWORD=ci-password postgres:17-alpine
          # `pg_isready` REPORTS TRUE DURING INIT — the image runs a temporary server on the same
          # socket — so wait on a real query, exactly as the local harness had to learn to.
          for i in $(seq 1 40); do
            docker exec supabase-db psql -U postgres -tAc 'select 1' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec supabase-db psql -U postgres -v ON_ERROR_STOP=1 \
            -c "create role dagster login password 'ci-password'" \
            -c "create database dagster owner dagster"
      - name: Boot all three, and stay booted
        run: |
          bash /tmp/boot.sh
          # FORTY-FIVE SECONDS, because a crash loop looks like a healthy service for the first
          # few. Swarm reported `1/1` for both of these while they were restarting every ten.
          sleep 45
          bad=0
          for c in muffin-ingest dagster-daemon dagster-webserver; do
            running=$(docker inspect -f '{{.State.Running}}' "$c" 2>/dev/null || echo false)
            restarts=$(docker inspect -f '{{.RestartCount}}' "$c" 2>/dev/null || echo 0)
            echo "  $c running=$running restarts=$restarts"
            if [ "$running" != "true" ] || [ "$restarts" != "0" ]; then
              bad=1
              echo "::error::$c did not stay up — last 30 lines:"
              docker logs --tail 30 "$c" 2>&1 | sed 's/^/    /'
            fi
          done
          [ "$bad" = 0 ] || exit 1
          echo "  ok  all three stayed up for 45s with no restart"
      - name: The webserver serves, and the code location actually loaded
        # Being up is not the same as working: the webserver stays up perfectly well while the
        # gRPC code location behind it is failing to import, and then every asset is missing.
        run: |
          docker run --rm --network muffin-ci curlimages/curl:8.11.1 -sf \
            http://dagster-webserver:3000/server_info > /dev/null
          echo "  ok  webserver answers /server_info"
          body='{"query":"{repositoriesOrError{... on RepositoryConnection{nodes{location{name}}}}}"}'
          out=$(docker run --rm --network muffin-ci curlimages/curl:8.11.1 -sf \
            -H 'Content-Type: application/json' -d "$body" \
            http://dagster-webserver:3000/graphql)
          echo "$out"
          echo "$out" | grep -q 'muffin_ingest' || {
            echo "::error::the webserver is up but the code location did not load"; exit 1; }
          echo "  ok  code location muffin_ingest loaded"
      - name: Logs, whatever happened
        if: always()
        run: for c in muffin-ingest dagster-daemon dagster-webserver; do echo "=== $c ==="; docker logs --tail 40 "$c" 2>&1 || true; done

  # Every provider the edge functions reach must have a `location` in the cache config.
  #
  # WHY THIS IS A CI GATE AND NOT A COMMENT. `origins.ts` defaults to the REAL origin, so a
  # provider with no cache location keeps working — it just silently bypasses the cache forever.
  # Nothing in production can report that: the resource succeeds, the data is right, and the only
  # symptom is a provider bill and a rate limit nobody connected to the omission. Same shape as
  # logic-check's rule that a `source_code` literal must be seeded by a migration.
  http-cache-covers-every-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every origin has a cache location
        run: |
          python - <<'PY'
          import re, sys, pathlib
          conf = pathlib.Path('stack/proxy/nginx.conf').read_text()
          origins = pathlib.Path('stack/supabase/functions/market-refresh/origins.ts').read_text()
          # Each exported origin helper names its upstream host in the fallback.
          hosts = re.findall(r"origin\('[A-Z_]+',\s*'https://([^/']+)'\)", origins)
          proxied = set(re.findall(r'set \$up "([^":]+)', conf))
          missing = [h for h in hosts if h not in proxied]
          if missing:
              print(f"::error::providers with no location in nginx.conf: {', '.join(missing)}")
              sys.exit(1)
          # And the reverse: a location for a host nothing reaches is dead config.
          extra = [h for h in proxied if h not in hosts and h not in {'openbb-api', 'openbb-mcp'}]
          if extra:
              print(f"::error::nginx.conf proxies hosts no caller uses: {', '.join(extra)}")
              sys.exit(1)
          # THE DIRECTION THIS GUARD WAS BLIND TO, and it cost a real provider. Both checks above
          # compare origins.ts against nginx.conf, so a provider that never entered origins.ts is
          # in NEITHER and passes silently. `wikidata.ts` hardcoded
          # `https://query.wikidata.org/sparql` and went straight out on every run while this job
          # reported success. Same shape as `exchange-listings` being deployed, reachable and
          # absent from the cron: the guard asked "is everything declared wired up?", which cannot
          # see something that was never declared.
          #
          # So: no module under market-refresh may name an external host directly. `esm.sh` is
          # exempt because that is a MODULE IMPORT resolved by Deno at load time, not a provider
          # call — it never goes through the data path and cannot be proxied by nginx.
          fns = pathlib.Path('stack/supabase/functions/market-refresh')
          EXEMPT = {'esm.sh'}
          offenders = []
          for f in sorted(fns.glob('*.ts')):
              if f.name == 'origins.ts':
                  continue
              for n, line in enumerate(f.read_text().splitlines(), 1):
                  st = line.lstrip()
                  if st.startswith(('*', '/*', '//')):
                      continue
                  # STRIP A TRAILING COMMENT WITHOUT EATING THE SCHEME. `line.split('//')[0]`
                  # truncates `https://host` at `https:` — so the first version of this check
                  # reported a deliberately reintroduced defect as CLEAN. The lookbehind is what
                  # makes the guard able to fail at all.
                  code = re.sub(r'(?<!:)//.*$', '', line)
                  for host in re.findall(r"https://([A-Za-z0-9.-]+)", code):
                      if host not in EXEMPT:
                          offenders.append(f"{f.name}:{n} {host}")
          if offenders:
              print("::error::provider URLs hardcoded outside origins.ts — these bypass http-cache "
                    "silently and no other check can see them: " + '; '.join(offenders))
              sys.exit(1)

          # A location nothing ROUTES to cannot fail and cannot be wrong — the same blind spot that
          # left `exchange-listings` absent from the cron for weeks. Assert the wiring, not just
          # the config: if nginx.conf caches /mcp/, the agent must be pointed at it, and openbb-mcp
          # must be in JSON mode or streamable HTTP answers SSE and the location is unreachable.
          compose = pathlib.Path('stack/docker-compose.yaml').read_text()
          if 'location /mcp/' in conf:
              if 'http-cache:8080/mcp' not in compose:
                  print("::error::nginx.conf caches /mcp/ but OPENBB_MCP_URL does not point at http-cache")
                  sys.exit(1)
              if 'FASTMCP_JSON_RESPONSE: "true"' not in compose:
                  print("::error::/mcp/ is cached but openbb-mcp lacks FASTMCP_JSON_RESPONSE=true — "
                        "streamable HTTP answers SSE and the location is unreachable")
                  sys.exit(1)
          # Same for the REST hop and each provider base URL.
          if 'http-cache:8080/openbb' not in compose:
              print("::error::OPENBB_API_URL does not point at http-cache")
              sys.exit(1)
          print(f"ok  {len(hosts)} providers cached, MCP + REST hops wired")
          PY

  # Apply every migration against a throwaway Postgres, TWICE.
  #
  # This exists because three separate migration defects reached production, and each failed the
  # whole deploy for a reason nothing in CI could see:
  #   * `with_fileglob` returned files unsorted, so 04 ran before 02;
  #   * `create or replace view` cannot rename or reorder columns, only append;
  #   * a foreign key rejected an ISO code the country table did not have (Singapore).
  #
  # The SECOND pass is the important one: these migrations are re-applied on every deploy, so
  # "works on an empty database" is only half the contract. The first pass proves a fresh install,
  # the second proves a redeploy.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Apply the legacy migrations twice
        # STILL APPLIED, AND STILL TWICE — as the REFERENCE the baseline is measured against.
        # These 204 files are no longer applied by a deploy (see `migrations-legacy/`), but they
        # remain the definition of what this schema is supposed to be, and the equivalence proof
        # below is the only thing that makes retiring them safe.
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -q -c \
            "create role anon nologin; create role authenticated nologin;
             create role service_role nologin bypassrls;"

          # 01 and 03 reference auth.users / GoTrue-owned schemas, which only exist in a real
          # Supabase stack — they are applied there after GoTrue has migrated, and cannot be
          # exercised here.
          # 001 and 003 reference auth.users / GoTrue-owned schemas, which only exist in a real
          # Supabase stack. They now live in `always/` — they are IDEMPOTENT BY DESIGN and must run
          # on EVERY deploy, which is exactly why they cannot be baselined: `003-security.sql`
          # revokes the DEFAULT PRIVILEGES so a table LangGraph creates later cannot silently
          # re-acquire anon access, and it only works because it re-runs.
          files=$(ls stack/supabase/migrations-legacy/*.sql | sort)

          for pass in 1 2; do
            echo "--- pass $pass ---"
            for f in $files; do
              # `--single-transaction` mirrors how Ansible applies these in production. Without the
              # flag here, CI would pass on a set that fails there — a migration whose statements
              # only work because each autocommits separately would go unnoticed.
              if ! psql -h localhost -U postgres -q --single-transaction -v ON_ERROR_STOP=1 -f "$f" > /tmp/out 2>&1; then
                echo "::error::$(basename "$f") failed on pass $pass: $(grep -m1 ERROR /tmp/out)"
                exit 1
              fi
            done
            echo "  ok  $(echo "$files" | wc -l | tr -d ' ') legacy migrations"

            # A RE-PARSE TRIGGER MUST FIRE ONCE, NOT ON EVERY DEPLOY.
            # `segment_parser.version` re-queues EVERY filing when it changes. Migration 169
            # bumped it unguarded and therefore re-queued the whole corpus on every deploy:
            # measured 2026-09-05 the version had reached 15, `pending_segments` stood at 213,500
            # against a drain of 20 per run, and 94% of the filings behind a SERVED split were
            # stale — not because the queue was slow, but because each deploy invalidated the work
            # the last one had done. Migration 154 guards the same bump correctly and its comment
            # predicted this exactly, one file earlier.
            # Pass 2 is where it shows: an unguarded bump moves the number a second time.
            v=$(psql -h localhost -U postgres -tAc "select version from market.segment_parser" 2>/dev/null | tr -d ' ')
            if [ "$pass" = "1" ]; then v1="$v"; fi
            if [ "$pass" = "2" ] && [ -n "$v1" ] && [ "$v" != "$v1" ]; then
              echo "::error::segment_parser.version moved $v1 -> $v on a re-apply. A version bump must be guarded by market.one_shot, or every deploy re-queues the entire corpus."
              exit 1
            fi
          done

      # Applying cleanly is only half the contract — a view can be valid SQL and still express an
      # invariant that can never be satisfied. `pending_industry` did exactly that: it reported work
      # forever while the same 300 securities were re-fetched on every run, with no error anywhere.
      # THE BASELINE MUST BE WHAT THE 204 MIGRATIONS PRODUCE. THIS IS THE CHECK THAT MAKES
      # RETIRING THEM SAFE, AND IT IS THE WHOLE REASON THE CUTOVER IS A SEPARATE PR.
      #
      # Baselining marks the historical migrations applied and stops running them. If the baseline
      # differs from what they build, every future `supabase db diff` is computed against the wrong
      # starting point and generates migrations that are wrong in a way nothing else would catch.
      #
      # The baseline is generated HERE rather than dumped from production, deliberately: a
      # hand-edit made in Studio would otherwise be baked in and become the definition. The schema
      # the migrations produce is the definition.
      - name: The baseline is what the legacy migrations produce
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          dump() {  # schema only, ours only, and stable enough to diff
            pg_dump -h localhost -U postgres --schema-only --no-owner --no-privileges \
              --schema=market --schema=api --schema=ingest "$1" \
              | grep -vE '^(--|SET |SELECT pg_catalog|$)'
          }
          dump postgres > /tmp/from-legacy.sql

          # A FRESH database, so the baseline is proven to stand on its own rather than to be a
          # no-op against a schema that already exists.
          psql -h localhost -U postgres -q -c 'create database baseline'
          if ! psql -h localhost -U postgres -d baseline -q --single-transaction \
                 -v ON_ERROR_STOP=1 -f stack/supabase/migrations/*_baseline.sql > /tmp/bl.out 2>&1; then
            echo "::error::the baseline failed to apply: $(grep -m1 ERROR /tmp/bl.out)"
            cat /tmp/bl.out; exit 1
          fi
          dump baseline > /tmp/from-baseline.sql

          if ! diff -u /tmp/from-legacy.sql /tmp/from-baseline.sql > /tmp/schema.diff; then
            echo "::error::the baseline does not reproduce the schema the migrations build"
            head -60 /tmp/schema.diff
            echo "regenerate: download the \`baseline\` artifact from this run and commit it"
            exit 1
          fi
          echo "  ok  the baseline reproduces the legacy schema exactly"

      # Regenerating is downloading this, never hand-editing: the text is pg_dump's own rendering.
      - name: Publish the schema the migrations build, so the baseline can be regenerated
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          mkdir -p /tmp/baseline
          pg_dump -h localhost -U postgres --schema-only --no-owner --no-privileges \
            --schema=market --schema=api --schema=ingest postgres \
            > /tmp/baseline/candidate_baseline.sql || true
      - name: Upload it
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline
          path: /tmp/baseline
          if-no-files-found: ignore

      # `always/` RUNS ON EVERY DEPLOY, SO IT MUST BE SAFE TO RUN ON EVERY DEPLOY.
      #
      # It cannot be exercised against `auth.users` here, so this asserts the property that does not
      # need GoTrue: applying it twice to the same database must leave the same schema. An
      # `always/` file that is not idempotent would fail every deploy after the first.
      - name: always/ is idempotent
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -q -c 'create database alwaystest'
          psql -h localhost -U postgres -d alwaystest -q -c \
            "create schema if not exists auth;
             create table if not exists auth.users (id uuid primary key);
             create or replace function auth.uid() returns uuid language sql as \$\$ select null::uuid \$\$;
             create role anon nologin; create role authenticated nologin;
             create role service_role nologin bypassrls;"
          snap() {
            pg_dump -h localhost -U postgres --schema-only --no-owner alwaystest \
              | grep -vE '^(--|SET |SELECT pg_catalog|$)'
          }
          for pass in 1 2; do
            for f in $(ls stack/supabase/always/*.sql | sort); do
              if ! psql -h localhost -U postgres -d alwaystest -q --single-transaction \
                     -v ON_ERROR_STOP=1 -f "$f" > /tmp/a.out 2>&1; then
                echo "::error::$(basename "$f") failed on pass $pass: $(grep -m1 ERROR /tmp/a.out)"
                cat /tmp/a.out; exit 1
              fi
            done
            snap > "/tmp/always-$pass.sql"
          done
          diff -u /tmp/always-1.sql /tmp/always-2.sql \
            || { echo "::error::always/ is not idempotent — it changes the schema on a second run"; exit 1; }
          echo "  ok  always/ applies twice with no difference"

      # THE REPEATABLE BUNDLE MUST BE WHAT THE MIGRATIONS PRODUCE.
      #
      # `create or replace view` can only APPEND columns, so the earliest file defining a view can
      # never replace the latest one's shape — and the set has grown to where **36 of 84 views and
      # 10 of 40 functions are defined more than once**, up to TWELVE times for
      # `symbol_cache_classification`. Every deploy re-runs all twelve, and any definer that has to
      # change a shape must `drop` first: a real window, every deploy, in which a view and its
      # dependents do not exist. `permission denied for view pending_segments` has been seen in
      # `refresh_run` for exactly that.
      #
      # The other half is silent. Migration 106 rebuilt `symbol_cache_classification` from
      # migration 050's nine entries and deleted the eight added since; only a behaviour test
      # naming all seventeen caught it. One definition per object makes that impossible.
      #
      # This does NOT change how deploys work yet. It extracts the definitions the migrations
      # actually produced and fails if the committed bundle differs — so while both exist they
      # cannot drift, and the cutover becomes a small change rather than a leap.
      - name: The repeatable bundle matches what the migrations produce
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 .github/scripts/extract_repeatable.py \
            --dsn "postgresql://postgres@localhost:5432/postgres" --out /tmp/extracted
          if ! diff -ru stack/supabase/repeatable /tmp/extracted > /tmp/bundle.diff; then
            echo "::error::the repeatable bundle no longer matches the migrations — regenerate it"
            head -60 /tmp/bundle.diff
            echo "regenerate: download the `repeatable-bundle` artifact from this run and commit it"
            exit 1
          fi
          echo "  ok  $(ls /tmp/extracted | wc -l | tr -d ' ') objects match the migrations"
      # The extraction is reproducible from the migrations, so a mismatch is regenerated rather
      # than hand-edited: `create or replace view` output is the SERVER's own rendering, and hand
      # editing it would reintroduce exactly the drift this check exists to prevent.
      - name: Publish the extraction so a mismatch can be regenerated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repeatable-bundle
          path: /tmp/extracted
          if-no-files-found: ignore

      # AND APPLYING IT MUST BE A NO-OP AGAINST THE SCHEMA THE MIGRATIONS BUILT.
      #
      # Extraction proves the bundle SAYS what the migrations say. This proves it DOES: applied
      # over the migrated schema, in one transaction exactly as the deploy will, re-extracting
      # afterwards must produce the identical files. A bundle that reproduces its own text while
      # changing a view would otherwise be invisible until an app query returned a different shape.
      #
      # Expressed as a re-extraction rather than a hash of definitions, because a hash tells you
      # THAT something moved and never WHAT — and the first version of this check reported exactly
      # that, leaving the actual difference to be reconstructed out of a truncated log.
      - name: Applying the bundle changes nothing
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # `check_function_bodies = off` is what lets functions be created before the views they
          # read — the same ordering `pg_dump` uses, and for the same reason.
          { echo "set check_function_bodies = off;"; cat stack/supabase/repeatable/*.sql; } \
            | psql -h localhost -U postgres -q --single-transaction -v ON_ERROR_STOP=1 > /tmp/b.out 2>&1 \
            || { echo "::error::the bundle failed to apply: $(grep -m1 ERROR /tmp/b.out)"; cat /tmp/b.out; exit 1; }

          python3 .github/scripts/extract_repeatable.py \
            --dsn "postgresql://postgres@localhost:5432/postgres" --out /tmp/reextracted
          if ! diff -ru stack/supabase/repeatable /tmp/reextracted > /tmp/after.diff; then
            echo "::error::applying the bundle CHANGED an object definition:"
            head -80 /tmp/after.diff
            exit 1
          fi
          echo "  ok  applying the bundle leaves every definition identical"

      - name: Behaviour — every backlog is satisfiable
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for t in stack/supabase/tests/*.sql; do
            if ! psql -h localhost -U postgres -q -v ON_ERROR_STOP=1 -f "$t" > /tmp/t.out 2>&1; then
              echo "::error::$(basename "$t") failed: $(grep -m1 -E 'ERROR|EXCEPTION' /tmp/t.out)"
              cat /tmp/t.out
              exit 1
            fi
            # psql prefixes notices with `psql:<file>:<line>: NOTICE:`, so anchoring on the line
            # start silently prints nothing on success and the step looks like it did no work.
            sed -n 's/.*NOTICE: *//p' /tmp/t.out
          done

  # The edge functions were NEVER typechecked or tested by CI — they are Deno, and every job here
  # was Postgres, Terraform or Ansible. That is how a batched URL built by string interpolation, a
  # zero close accepted as a price and a series broken by a unit change all reached production and
  # returned 200 while doing so.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck
        # logic-check.ts is typechecked TOO, and that is not a tidiness point. It is only ever
        # `deno run`, which STRIPS types rather than checking them — so the one file that holds
        # every guard in this pipeline was the one file nothing typechecked. Three errors were
        # sitting on `main` when this was added (a missing `YahooHit` import, an optional chain
        # returning `boolean | undefined`), and the suite passed anyway. A guard file that does not
        # compile is a guard nobody can trust.
        run: |
          deno check stack/supabase/functions/market-refresh/index.ts \
                     stack/supabase/functions/market-refresh/logic-check.ts \
                     stack/supabase/functions/market-refresh/xbrl-check.ts \
                     stack/supabase/functions/market-refresh/segments-check.ts \
                     stack/supabase/functions/market-refresh/wikidata-check.ts \
                     stack/supabase/functions/market-refresh/dart-check.ts \
                     stack/supabase/functions/market-refresh/cn-check.ts \
                     stack/supabase/functions/market-refresh/cn-pdf-check.ts
      # Pure logic only — no network, no database, so it runs on every PR. `check.ts` covers the
      # same ground against a live openbb-api, but it needs one, so it only runs when someone
      # remembers. That is the difference between a rule that holds and a rule that held once.
      - name: Logic checks
        # --allow-read: the registry check reads the workflow and the handler as TEXT, because the
        # resource names live in files that cannot import each other.
        # A BLOCK SCALAR, not two lines appended to a plain one. Appending to `run: <cmd>` folds
        # the following lines INTO THE STRING — comments included — and the job fails to parse
        # with "This run likely failed because of a workflow file issue", which names no file and
        # no line.
        run: |
          deno run --allow-read stack/supabase/functions/market-refresh/logic-check.ts
          # The XBRL resolver is pure logic over a companyfacts-shaped payload, and every subtlety
          # in it fails silently — a wrong concept choice yields a shorter series, a mislabelled
          # duration yields a plausible wrong number. Driven offline, no network.
          deno run --allow-read stack/supabase/functions/market-refresh/xbrl-check.ts
          deno run --allow-read stack/supabase/functions/market-refresh/symbol-repair-check.ts
          # `fetchWithIsolation` decides whether a security may be recorded as unanswerable. Both
          # failure directions are silent: too eager writes a rate limit down as thousands of dead
          # companies (it once cost 1,369), too cautious stalls a backlog for ever on a batch it
          # refuses to judge. Driven offline against a stub fetcher.
          deno run --allow-read stack/supabase/functions/market-refresh/isolation-check.ts
          # THE SEGMENT PARSER IS WHERE A DOUBLE COUNT WOULD BE INVISIBLE. An XBRL axis can carry
          # several overlapping splits that EACH sum to the consolidated total — Amazon discloses
          # three — so summing an axis doubles the company's revenue and summing the table triples
          # it, with every individual number still correct. The fixtures are built so the candidate
          # rules disagree (7 lines / 167,702 against 9 lines / 335,404); all eight mutations of the
          # rules were confirmed to turn them red before this line was added.
          deno run --allow-read stack/supabase/functions/market-refresh/segments-check.ts
          # Wikidata is the loosest-shaped source here — crowd-sourced, open-vocabulary, and the
          # only multi-valued one. The failures it guards against are shapes: an empty industry
          # list read as one blank entry, a duplicate label hitting SQLSTATE 21000 on the node
          # upsert, and an unsanitised ISIN escaping a SPARQL string literal.
          deno run --allow-read stack/supabase/functions/market-refresh/wikidata-check.ts
          # DART hands back a ZIP, so the Korean path carries a binary reader nothing else here
          # needs — EOCD scan, central-directory walk, `DecompressionStream("deflate-raw")`. An
          # 800 KB fixture cannot be committed, so the check BUILDS one with `CompressionStream`
          # and round-trips it, with the two extra-field lengths deliberately different: local and
          # central headers disagree about that field in real archives, and reading the offset off
          # the wrong one yields garbage that still inflates. It also pins that DART's '013' is an
          # empty ANSWER rather than a failure, which is what stops a company with no annual report
          # being retried for ever.
          deno run --allow-read stack/supabase/functions/market-refresh/dart-check.ts
          # CNINFO files THREE documents under one "annual reports" category — the full report, a
          # summary that omits the mandated breakdown table entirely, and an English edition whose
          # headings are English. Storing them all as one type meant that of 8 companies sampled,
          # only 3 held a document a parser could ever read. The classifier is title-based and its
          # failure is silent, so every title here is quoted from the live API.
          deno run --allow-read stack/supabase/functions/market-refresh/cn-check.ts
          # THE ONLY PARSER HERE THAT READS A PDF, and its failure mode is a plausible wrong
          # answer. One Yangtze Power row occupies THREE visual lines with the money in the middle,
          # so read as text it yields the segment `行业` — "industry" — with the right number beside
          # it. The fixture is the MEASURED geometry rather than a document, because a 1.5 MB PDF
          # cannot be committed. --allow-net: it imports unpdf from esm.sh.
          deno run --allow-read --allow-net stack/supabase/functions/market-refresh/cn-pdf-check.ts

      # The quarter-shape check in market-verify rests on one number: that year-to-date stacking
      # gives a last/first quarter ratio near 3 while discrete quarters give near 1. That claim was
      # asserted in a docstring and never demonstrated — and three EARLIER versions of the same
      # check cried wolf on production for want of exactly this kind of proof. `--self-test` runs
      # the real statistic over synthetic discrete and cumulative series and fails if the threshold
      # does not separate them. No database, so it runs on every PR.
      # The textfile collectors are real files precisely so they can be checked here. The
      # per-service one shipped as inline `copy: content:` first and killed a deploy —
      # Ansible renders inline content through JINJA, and the script is full of braces
      # (`{{json .}}`, `{{service="..."}}`): `template error while templating string: expected
      # name or number`. A `src:` file is copied verbatim AND is lintable.
      - name: Offline check — the textfile collectors compile
        run: |
          set -euo pipefail
          for f in stack/observability/collectors/*.py; do
            python3 -m py_compile "$f"
            echo "  ok  $(basename "$f")"
          done
          for f in stack/observability/collectors/*.sh; do
            sh -n "$f"
            echo "  ok  $(basename "$f")"
          done

      # Ansible renders inline `copy: content:` through JINJA. The per-service collector shipped
      # that way first and killed a deploy — it is full of braces (`{{json .}}` for docker's format
      # string, `{{service="..."}}` for the Prometheus label) and Ansible answered
      # `template error while templating string: expected name or number`.
      #
      # The test is whether the block is VALID JINJA, not whether it contains braces: plenty of
      # inline content is MEANT to be templated (`AWS_ACCESS_KEY_ID={{ _s3_key }}`), and a guard
      # that flags those is a guard someone disables. Blocks are bounded by INDENTATION — the first
      # version matched any indented line, ran past the task boundary, swallowed the next task and
      # blamed the wrong script.
      # BASH-ONLY SYNTAX NEEDS `executable: /bin/bash`, AND THE FAILURE IS A DEPLOY, NOT A TEST.
      # Ansible's `shell:` runs under /bin/sh — DASH on Ubuntu — which has no `pipefail`, so
      # `set -euo pipefail` dies with `Illegal option -o pipefail` before the task's first real
      # command. It failed the scheduler deploy twice. Verifying the command by hand over ssh
      # cannot catch it, because an interactive ssh lands in bash; only Ansible uses /bin/sh.
      # Two tasks in the playbook already declared bash — the third did not, which is precisely
      # the "a rule written at one call site is not a rule" shape this repo keeps paying for.
      # A SQL DATASOURCE'S DATABASE NAME BELONGS IN jsonData, AND THE WRONG PLACE STILL CONNECTS.
      # Grafana 11+ moved it there. The deprecated top-level `database:` connects fine — the health
      # check says "Database Connection OK" and panels return rows — but the settings UI reads
      # jsonData.database, so the form field renders EMPTY and the page asks you to configure the
      # database. Worse, pressing Save on that page writes the empty field back and takes every
      # Postgres panel down. A working system one click from broken is exactly the shape this repo
      # keeps paying for, so it is a guard rather than a comment.
      - name: Offline check — SQL datasources put the database in jsonData
        run: |
          python3 - <<'PYCHK'
          import glob, sys, yaml
          SQL = ('postgres', 'grafana-postgresql-datasource', 'mysql', 'mssql')
          bad = []
          for path in sorted(glob.glob('stack/observability/grafana/provisioning/datasources/*.yml')):
              doc = yaml.safe_load(open(path)) or {}
              for ds in doc.get('datasources', []) or []:
                  if ds.get('type') not in SQL:
                      continue
                  name = ds.get('name', '?')
                  if 'database' in ds:
                      bad.append(f"{path}: '{name}' sets a TOP-LEVEL `database:` (deprecated; the UI cannot see it)")
                  if not (ds.get('jsonData') or {}).get('database'):
                      bad.append(f"{path}: '{name}' has no `jsonData.database`")
          if bad:
              print('::error::a SQL datasource declares its database in the wrong place')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('  ok  every SQL datasource declares jsonData.database')
          PYCHK
      - name: Offline check — every collector metric is plotted, and every panel is fed
        run: python3 .github/scripts/check_collector_metrics_are_plotted.py

      - name: Offline check — a panel must not filter away the state it reveals
        run: python3 .github/scripts/check_panels_do_not_hide_data.py

      # A panel that cannot RENDER is invisible and nothing reports it. `Sector × facet` selected
      # two columns named `sector` and showed "No Data" from the day PR #261 created it; four
      # facets added in migration 160 were dropped by a panel titled "every facet" and rendered
      # uncoloured in two heatmaps. Every one is a piece of config that ENUMERATES something and
      # went stale — which is why the facet list this guard checks against is parsed out of the
      # migration rather than written here.
      - name: Offline check — every panel can actually render
        run: python3 .github/scripts/check_dashboards_can_render.py

      - name: Offline check — bash-only syntax declares bash
        run: |
          python3 - <<'PYCHK'
          import re, sys, glob
          BASHISMS = ('pipefail', '<(', '>(', '[[ ', 'declare -A', '${!')
          bad = []
          for path in sorted(glob.glob('ansible/*.yml')):
              lines = open(path).read().splitlines()
              # Task blocks are bounded by the `- name:` markers at the same indentation, the same
              # way the Jinja guard above does it: a regex over the whole file runs past the task
              # boundary and blames whichever task happens to follow.
              starts = [i for i, l in enumerate(lines) if re.match(r'\s*- name:', l)]
              for n, i in enumerate(starts):
                  end = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  block = '\n'.join(lines[i:end])
                  hit = next((b for b in BASHISMS if b in block), None)
                  if hit and 'executable: /bin/bash' not in block:
                      bad.append(f"{path}:{i+1}  {lines[i].strip()}  (uses {hit!r})")
          if bad:
              print('::error::a task uses bash-only syntax without `args: executable: /bin/bash`')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('  ok  every task using bash-only syntax declares bash')
          PYCHK
      # `psql -c` DOES NOT INTERPOLATE `:'var'`, AND THAT HAS NOW FAILED THREE DEPLOYS.
      #
      # psql substitutes variables in its LEXER, on input read from a file or stdin. `-c` hands its
      # string straight to the server, so `-v pw=… -c "create role x login password :'pw'"` dies
      # with `syntax error at or near ":"` — the SAME message the dollar-quoted `do $$ … $$` form
      # produces, which is exactly why it reads as the already-known problem rather than a new one.
      #
      # Measured on the node, two commands apart:
      #   psql -tA -v x=hello -c "select :'x'"   ->  ERROR: syntax error at or near ":"
      #   echo "select :'x'" | psql -tA -v x=hello  ->  hello
      #
      # So a `-c` string containing `:'` or `:"` is always wrong. The fix is to pipe the statement
      # in, which is the one place `docker exec -i` is required.
      - name: Offline check — psql variables are not passed to -c
        run: |
          python3 - <<'PYCHK'
          import re, sys, glob
          bad = []
          for path in sorted(glob.glob('ansible/*.yml')):
              lines = open(path).read().splitlines()
              starts = [i for i, l in enumerate(lines) if re.match(r'\s*- name:', l)]
              for n, i in enumerate(starts):
                  end = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  block = '\n'.join(lines[i:end])
                  # Only the COMMAND matters, never the prose above it: this file explains the trap
                  # at length, and a check that reads its own documentation as a violation is one
                  # somebody deletes.
                  code = '\n'.join(l for l in block.splitlines() if not l.lstrip().startswith('#'))
                  for m in re.finditer(r'psql[^\n|]*?-c\s+(.)', code):
                      tail = code[m.start():m.start() + 400]
                      if re.search(r":'|:\"", tail.split('\n')[0]):
                          bad.append(f"{path}:{i+1}  {lines[i].strip()}")
                          break
          if bad:
              print("::error::a psql -c string uses :'var' interpolation, which -c does not perform")
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print("  ok  no psql -c string relies on variable interpolation")
          PYCHK
      # `create database … owner <role>` NEEDS TO BE ABLE TO SET ROLE, AND `postgres` IS NOT A
      # SUPERUSER HERE.
      #
      # PostgreSQL 16 requires the creating role to be a member of the owner it names. A superuser
      # bypasses that — and on the `supabase/postgres` image `pg_roles` reports `rolsuper = f` for
      # `postgres` (it has createdb and createrole; `supabase_admin` is the superuser). So the
      # obvious statement failed a deploy with a message that mentions neither databases nor
      # privileges:
      #
      #     ERROR:  must be able to SET ROLE "dagster"
      #
      # `dagster-boots` deliberately runs plain postgres and so cannot reproduce this; a static
      # pairing rule is the proportionate cover. It fires on the OWNER form only: `create database
      # x` with no owner is unaffected, and that is the common case.
      - name: Offline check — creating a database for another owner grants that role first
        run: |
          python3 - <<'PYCHK'
          import re, sys, glob
          bad = []
          for path in sorted(glob.glob('ansible/*.yml')):
              lines = open(path).read().splitlines()
              starts = [i for i, l in enumerate(lines) if re.match(r'\s*- name:', l)]
              for n, i in enumerate(starts):
                  end = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  code = '\n'.join(l for l in lines[i:end] if not l.lstrip().startswith('#'))
                  for m in re.finditer(r'create\s+database\s+\S+\s+owner\s+([A-Za-z_][A-Za-z0-9_]*)', code, re.I):
                      role = m.group(1)
                      if not re.search(rf'grant\s+{re.escape(role)}\s+to\s+postgres', code, re.I):
                          bad.append(f"{path}:{i+1}  {lines[i].strip()}  (owner {role!r})")
          if bad:
              print('::error::`create database … owner X` without `grant X to postgres` — postgres '
                    'is not a superuser on supabase/postgres and cannot SET ROLE to X')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('  ok  every database created for another owner grants that role first')
          PYCHK
      # THE COLLECTORS ARE REAL FILES, AND THEY MUST COMPILE. `muffin-service-metrics.py` was once
      # an inline `copy: content:` block and its `{{json .}}` format string killed a deploy, because
      # Ansible renders inline content through Jinja. They are `copy: src:` files now — which also
      # means CI can simply run them through the compiler, and a syntax error stops being something
      # you discover on the node.
      - name: Offline check — observability collectors compile
        run: |
          python3 - <<'PYCHK'
          import glob, py_compile, sys
          bad = []
          for path in sorted(glob.glob('stack/observability/collectors/*.py')):
              try:
                  py_compile.compile(path, doraise=True)
              except py_compile.PyCompileError as e:
                  bad.append(f"{path}: {e}")
          if bad:
              print('::error::a collector does not compile')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          n = len(glob.glob('stack/observability/collectors/*.py'))
          print(f'  ok  {n} python collector(s) compile')
          PYCHK
      - name: Offline check — inline-staged scripts are valid Jinja
        run: |
          pip install jinja2 --quiet
          python3 - <<'PY'
          import re, sys, pathlib
          from jinja2 import Environment
          env = Environment()
          lines = pathlib.Path('ansible/muffin_stack.yml').read_text().splitlines()
          bad = []
          for i, line in enumerate(lines):
              m = re.match(r'^(\s*)content: \|\s*$', line)
              if not m:
                  continue
              indent = len(m.group(1))
              block, j = [], i + 1
              while j < len(lines):
                  cur = lines[j]
                  if cur.strip() and (len(cur) - len(cur.lstrip())) <= indent:
                      break
                  block.append(cur)
                  j += 1
              text = "\n".join(block)
              try:
                  env.parse(text)
              except Exception as e:
                  first = next((b.strip() for b in block if b.strip()), '?')
                  bad.append(f"line {i+1} ({first[:50]}): {e}")
          if bad:
              print("::error::inline `copy: content:` that Ansible cannot template — move it to a "
                    "`src:` file, which is copied verbatim:")
              for b in bad:
                  print(f"  {b}")
              sys.exit(1)
          print("ok  every inline-staged script is valid Jinja")
          PY

      - name: Offline check — the quarter-shape threshold separates the two cases
        run: python3 .github/scripts/check_quarter_is_a_quarter.py --self-test

      # A GATE THAT IS RED FOR A DAY AFTER EVERY DEPLOY IS ONE NOBODY READS, and this repo has
      # already paid for that: market-verify sat red for six days on a check CLAUDE.md had
      # reclassified as a gauge, and a four-day `derive-classifications` outage went unseen behind
      # it. The spine check was relaxed from "any failure in the window" to "failing now, or twice"
      # — safe only if the cases it must still catch are demonstrated. This runs them, with no
      # database, so an edit that lets a broken spine pass goes red on the PR that makes it.
      - name: Offline check — a spine blip is not a broken spine
        run: python3 .github/scripts/check_spine_refresh_succeeds.py --self-test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.1"
          # The wrapper rewrites stdout, which makes `fmt -check` output useless.
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Init (no backend — no credentials needed)
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=terraform validate

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ansible-core + pinned collections
        run: |
          pip install ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Syntax check
        # Warns about the missing inventory (manager/workers resolve at deploy
        # time from the cloud.terraform dynamic inventory) and still exits 0 —
        # this validates playbook and role task structure, not connectivity.
        run: ansible-playbook --syntax-check ansible/muffin_stack.yml
      - name: Offline check — a staged file has a directory to land in
        # `copy`/`template` do not create parent directories, and a syntax check cannot see it.
        # PR #343 staged two named files into /home/ubuntu/dagster with nothing creating it and
        # the deploy died EIGHTEEN MINUTES IN — the second time this has happened, after
        # /home/ubuntu/proxy. `--self-test` runs the rule over synthetic playbooks (no repo, no
        # node), including the two cases that make it non-obvious: a directory-copy creates its
        # destination AND its parents, while an existing parent proves nothing about a child.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check_staged_files_have_a_directory.py --self-test
          python3 .github/scripts/check_staged_files_have_a_directory.py ansible/muffin_stack.yml
