name: Quality

# The merge gate for this repo. Until now nothing checked a pull request here:
# deploy.yml only fires on workflow_dispatch / repository_dispatch, so a
# malformed .tf or a broken playbook task was discoverable only by running a
# deploy against the live Oracle node — which is also the thing that once
# replaced the VM and wiped every database.
#
# Everything below runs WITHOUT credentials and WITHOUT touching real infra:
# `terraform init -backend=false` skips the OCI Object Storage backend, and
# `ansible-playbook --syntax-check` needs no inventory or SSH key.
#
# NOTE: deliberately NO `paths` / `paths-ignore` filter. This is a REQUIRED
# status check, and a filtered workflow never reports on a PR that misses the
# filter — leaving the PR blocked on a check that will never arrive.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # PARSE the Swarm stack template, don't eyeball it.
  #
  # A one-line volume mount was inserted mid-`environment:` because the anchor it was placed after
  # was unique but not the END of its block — which orphaned two env keys under `volumes:` and
  # failed the deploy with `yaml: line 603: did not find expected '-' indicator`. Nothing in CI
  # looked at this file, so a syntax error in the thing that defines every service reached the node.
  #
  # Jinja is stripped rather than rendered: the values do not matter, the STRUCTURE does.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Parse the stack template
        run: |
          python - <<'PY'
          import re, sys, yaml
          raw = open('stack/docker-compose.yaml').read()
          rendered = re.sub(r'\{%.*?%\}', '', re.sub(r'\{\{.*?\}\}', 'x', raw, flags=re.S), flags=re.S)
          try:
              doc = yaml.safe_load(rendered)
          except yaml.YAMLError as e:
              print(f"::error::stack/docker-compose.yaml is not valid YAML: {e}")
              sys.exit(1)
          services = doc.get('services') or {}
          if not services:
              print("::error::no services parsed — the template rendered to something unexpected")
              sys.exit(1)
          # A service whose `environment` came back as anything but a mapping means a block was
          # split, which is the exact failure above and is otherwise invisible.
          bad = [n for n, s in services.items()
                 if 'environment' in s and not isinstance(s['environment'], (dict, list))]
          if bad:
              print(f"::error::malformed `environment` in: {', '.join(bad)}")
              sys.exit(1)
          print(f"ok  {len(services)} services parsed")
          PY

  # Every provider the edge functions reach must have a `location` in the cache config.
  #
  # WHY THIS IS A CI GATE AND NOT A COMMENT. `origins.ts` defaults to the REAL origin, so a
  # provider with no cache location keeps working — it just silently bypasses the cache forever.
  # Nothing in production can report that: the resource succeeds, the data is right, and the only
  # symptom is a provider bill and a rate limit nobody connected to the omission. Same shape as
  # logic-check's rule that a `source_code` literal must be seeded by a migration.
  http-cache-covers-every-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every origin has a cache location
        run: |
          python - <<'PY'
          import re, sys, pathlib
          conf = pathlib.Path('stack/proxy/nginx.conf').read_text()
          origins = pathlib.Path('stack/supabase/functions/market-refresh/origins.ts').read_text()
          # Each exported origin helper names its upstream host in the fallback.
          hosts = re.findall(r"origin\('[A-Z_]+',\s*'https://([^/']+)'\)", origins)
          proxied = set(re.findall(r'set \$up "([^":]+)', conf))
          missing = [h for h in hosts if h not in proxied]
          if missing:
              print(f"::error::providers with no location in nginx.conf: {', '.join(missing)}")
              sys.exit(1)
          # And the reverse: a location for a host nothing reaches is dead config.
          extra = [h for h in proxied if h not in hosts and h not in {'openbb-api', 'openbb-mcp'}]
          if extra:
              print(f"::error::nginx.conf proxies hosts no caller uses: {', '.join(extra)}")
              sys.exit(1)
          # THE DIRECTION THIS GUARD WAS BLIND TO, and it cost a real provider. Both checks above
          # compare origins.ts against nginx.conf, so a provider that never entered origins.ts is
          # in NEITHER and passes silently. `wikidata.ts` hardcoded
          # `https://query.wikidata.org/sparql` and went straight out on every run while this job
          # reported success. Same shape as `exchange-listings` being deployed, reachable and
          # absent from the cron: the guard asked "is everything declared wired up?", which cannot
          # see something that was never declared.
          #
          # So: no module under market-refresh may name an external host directly. `esm.sh` is
          # exempt because that is a MODULE IMPORT resolved by Deno at load time, not a provider
          # call — it never goes through the data path and cannot be proxied by nginx.
          fns = pathlib.Path('stack/supabase/functions/market-refresh')
          EXEMPT = {'esm.sh'}
          offenders = []
          for f in sorted(fns.glob('*.ts')):
              if f.name == 'origins.ts':
                  continue
              for n, line in enumerate(f.read_text().splitlines(), 1):
                  st = line.lstrip()
                  if st.startswith(('*', '/*', '//')):
                      continue
                  # STRIP A TRAILING COMMENT WITHOUT EATING THE SCHEME. `line.split('//')[0]`
                  # truncates `https://host` at `https:` — so the first version of this check
                  # reported a deliberately reintroduced defect as CLEAN. The lookbehind is what
                  # makes the guard able to fail at all.
                  code = re.sub(r'(?<!:)//.*$', '', line)
                  for host in re.findall(r"https://([A-Za-z0-9.-]+)", code):
                      if host not in EXEMPT:
                          offenders.append(f"{f.name}:{n} {host}")
          if offenders:
              print("::error::provider URLs hardcoded outside origins.ts — these bypass http-cache "
                    "silently and no other check can see them: " + '; '.join(offenders))
              sys.exit(1)

          # A location nothing ROUTES to cannot fail and cannot be wrong — the same blind spot that
          # left `exchange-listings` absent from the cron for weeks. Assert the wiring, not just
          # the config: if nginx.conf caches /mcp/, the agent must be pointed at it, and openbb-mcp
          # must be in JSON mode or streamable HTTP answers SSE and the location is unreachable.
          compose = pathlib.Path('stack/docker-compose.yaml').read_text()
          if 'location /mcp/' in conf:
              if 'http-cache:8080/mcp' not in compose:
                  print("::error::nginx.conf caches /mcp/ but OPENBB_MCP_URL does not point at http-cache")
                  sys.exit(1)
              if 'FASTMCP_JSON_RESPONSE: "true"' not in compose:
                  print("::error::/mcp/ is cached but openbb-mcp lacks FASTMCP_JSON_RESPONSE=true — "
                        "streamable HTTP answers SSE and the location is unreachable")
                  sys.exit(1)
          # Same for the REST hop and each provider base URL.
          if 'http-cache:8080/openbb' not in compose:
              print("::error::OPENBB_API_URL does not point at http-cache")
              sys.exit(1)
          print(f"ok  {len(hosts)} providers cached, MCP + REST hops wired")
          PY

  # Apply every migration against a throwaway Postgres, TWICE.
  #
  # This exists because three separate migration defects reached production, and each failed the
  # whole deploy for a reason nothing in CI could see:
  #   * `with_fileglob` returned files unsorted, so 04 ran before 02;
  #   * `create or replace view` cannot rename or reorder columns, only append;
  #   * a foreign key rejected an ISO code the country table did not have (Singapore).
  #
  # The SECOND pass is the important one: these migrations are re-applied on every deploy, so
  # "works on an empty database" is only half the contract. The first pass proves a fresh install,
  # the second proves a redeploy.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations twice
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -q -c \
            "create role anon nologin; create role authenticated nologin;
             create role service_role nologin bypassrls;"

          # 01 and 03 reference auth.users / GoTrue-owned schemas, which only exist in a real
          # Supabase stack — they are applied there after GoTrue has migrated, and cannot be
          # exercised here.
          files=$(ls stack/supabase/migrations/*.sql | grep -vE '/(001|003)-' | sort)

          for pass in 1 2; do
            echo "--- pass $pass ---"
            for f in $files; do
              # `--single-transaction` mirrors how Ansible applies these in production. Without the
              # flag here, CI would pass on a set that fails there — a migration whose statements
              # only work because each autocommits separately would go unnoticed.
              if ! psql -h localhost -U postgres -q --single-transaction -v ON_ERROR_STOP=1 -f "$f" > /tmp/out 2>&1; then
                echo "::error::$(basename "$f") failed on pass $pass: $(grep -m1 ERROR /tmp/out)"
                exit 1
              fi
            done
            echo "  ok  $(echo "$files" | wc -l | tr -d ' ') migrations"

            # A RE-PARSE TRIGGER MUST FIRE ONCE, NOT ON EVERY DEPLOY.
            # `segment_parser.version` re-queues EVERY filing when it changes. Migration 169
            # bumped it unguarded and therefore re-queued the whole corpus on every deploy:
            # measured 2026-09-05 the version had reached 15, `pending_segments` stood at 213,500
            # against a drain of 20 per run, and 94% of the filings behind a SERVED split were
            # stale — not because the queue was slow, but because each deploy invalidated the work
            # the last one had done. Migration 154 guards the same bump correctly and its comment
            # predicted this exactly, one file earlier.
            # Pass 2 is where it shows: an unguarded bump moves the number a second time.
            v=$(psql -h localhost -U postgres -tAc "select version from market.segment_parser" 2>/dev/null | tr -d ' ')
            if [ "$pass" = "1" ]; then v1="$v"; fi
            if [ "$pass" = "2" ] && [ -n "$v1" ] && [ "$v" != "$v1" ]; then
              echo "::error::segment_parser.version moved $v1 -> $v on a re-apply. A version bump must be guarded by market.one_shot, or every deploy re-queues the entire corpus."
              exit 1
            fi
          done

      # Applying cleanly is only half the contract — a view can be valid SQL and still express an
      # invariant that can never be satisfied. `pending_industry` did exactly that: it reported work
      # forever while the same 300 securities were re-fetched on every run, with no error anywhere.
      - name: Behaviour — every backlog is satisfiable
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for t in stack/supabase/tests/*.sql; do
            if ! psql -h localhost -U postgres -q -v ON_ERROR_STOP=1 -f "$t" > /tmp/t.out 2>&1; then
              echo "::error::$(basename "$t") failed: $(grep -m1 -E 'ERROR|EXCEPTION' /tmp/t.out)"
              cat /tmp/t.out
              exit 1
            fi
            # psql prefixes notices with `psql:<file>:<line>: NOTICE:`, so anchoring on the line
            # start silently prints nothing on success and the step looks like it did no work.
            sed -n 's/.*NOTICE: *//p' /tmp/t.out
          done

  # The edge functions were NEVER typechecked or tested by CI — they are Deno, and every job here
  # was Postgres, Terraform or Ansible. That is how a batched URL built by string interpolation, a
  # zero close accepted as a price and a series broken by a unit change all reached production and
  # returned 200 while doing so.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck
        # logic-check.ts is typechecked TOO, and that is not a tidiness point. It is only ever
        # `deno run`, which STRIPS types rather than checking them — so the one file that holds
        # every guard in this pipeline was the one file nothing typechecked. Three errors were
        # sitting on `main` when this was added (a missing `YahooHit` import, an optional chain
        # returning `boolean | undefined`), and the suite passed anyway. A guard file that does not
        # compile is a guard nobody can trust.
        run: |
          deno check stack/supabase/functions/market-refresh/index.ts \
                     stack/supabase/functions/market-refresh/logic-check.ts \
                     stack/supabase/functions/market-refresh/xbrl-check.ts \
                     stack/supabase/functions/market-refresh/segments-check.ts \
                     stack/supabase/functions/market-refresh/wikidata-check.ts \
                     stack/supabase/functions/market-refresh/dart-check.ts
      # Pure logic only — no network, no database, so it runs on every PR. `check.ts` covers the
      # same ground against a live openbb-api, but it needs one, so it only runs when someone
      # remembers. That is the difference between a rule that holds and a rule that held once.
      - name: Logic checks
        # --allow-read: the registry check reads the workflow and the handler as TEXT, because the
        # resource names live in files that cannot import each other.
        # A BLOCK SCALAR, not two lines appended to a plain one. Appending to `run: <cmd>` folds
        # the following lines INTO THE STRING — comments included — and the job fails to parse
        # with "This run likely failed because of a workflow file issue", which names no file and
        # no line.
        run: |
          deno run --allow-read stack/supabase/functions/market-refresh/logic-check.ts
          # The XBRL resolver is pure logic over a companyfacts-shaped payload, and every subtlety
          # in it fails silently — a wrong concept choice yields a shorter series, a mislabelled
          # duration yields a plausible wrong number. Driven offline, no network.
          deno run --allow-read stack/supabase/functions/market-refresh/xbrl-check.ts
          deno run --allow-read stack/supabase/functions/market-refresh/symbol-repair-check.ts
          # `fetchWithIsolation` decides whether a security may be recorded as unanswerable. Both
          # failure directions are silent: too eager writes a rate limit down as thousands of dead
          # companies (it once cost 1,369), too cautious stalls a backlog for ever on a batch it
          # refuses to judge. Driven offline against a stub fetcher.
          deno run --allow-read stack/supabase/functions/market-refresh/isolation-check.ts
          # THE SEGMENT PARSER IS WHERE A DOUBLE COUNT WOULD BE INVISIBLE. An XBRL axis can carry
          # several overlapping splits that EACH sum to the consolidated total — Amazon discloses
          # three — so summing an axis doubles the company's revenue and summing the table triples
          # it, with every individual number still correct. The fixtures are built so the candidate
          # rules disagree (7 lines / 167,702 against 9 lines / 335,404); all eight mutations of the
          # rules were confirmed to turn them red before this line was added.
          deno run --allow-read stack/supabase/functions/market-refresh/segments-check.ts
          # Wikidata is the loosest-shaped source here — crowd-sourced, open-vocabulary, and the
          # only multi-valued one. The failures it guards against are shapes: an empty industry
          # list read as one blank entry, a duplicate label hitting SQLSTATE 21000 on the node
          # upsert, and an unsanitised ISIN escaping a SPARQL string literal.
          deno run --allow-read stack/supabase/functions/market-refresh/wikidata-check.ts
          # DART hands back a ZIP, so the Korean path carries a binary reader nothing else here
          # needs — EOCD scan, central-directory walk, `DecompressionStream("deflate-raw")`. An
          # 800 KB fixture cannot be committed, so the check BUILDS one with `CompressionStream`
          # and round-trips it, with the two extra-field lengths deliberately different: local and
          # central headers disagree about that field in real archives, and reading the offset off
          # the wrong one yields garbage that still inflates. It also pins that DART's '013' is an
          # empty ANSWER rather than a failure, which is what stops a company with no annual report
          # being retried for ever.
          deno run --allow-read stack/supabase/functions/market-refresh/dart-check.ts

      # The quarter-shape check in market-verify rests on one number: that year-to-date stacking
      # gives a last/first quarter ratio near 3 while discrete quarters give near 1. That claim was
      # asserted in a docstring and never demonstrated — and three EARLIER versions of the same
      # check cried wolf on production for want of exactly this kind of proof. `--self-test` runs
      # the real statistic over synthetic discrete and cumulative series and fails if the threshold
      # does not separate them. No database, so it runs on every PR.
      # The textfile collectors are real files precisely so they can be checked here. The
      # per-service one shipped as inline `copy: content:` first and killed a deploy —
      # Ansible renders inline content through JINJA, and the script is full of braces
      # (`{{json .}}`, `{{service="..."}}`): `template error while templating string: expected
      # name or number`. A `src:` file is copied verbatim AND is lintable.
      - name: Offline check — the textfile collectors compile
        run: |
          set -euo pipefail
          for f in stack/observability/collectors/*.py; do
            python3 -m py_compile "$f"
            echo "  ok  $(basename "$f")"
          done
          for f in stack/observability/collectors/*.sh; do
            sh -n "$f"
            echo "  ok  $(basename "$f")"
          done

      # Ansible renders inline `copy: content:` through JINJA. The per-service collector shipped
      # that way first and killed a deploy — it is full of braces (`{{json .}}` for docker's format
      # string, `{{service="..."}}` for the Prometheus label) and Ansible answered
      # `template error while templating string: expected name or number`.
      #
      # The test is whether the block is VALID JINJA, not whether it contains braces: plenty of
      # inline content is MEANT to be templated (`AWS_ACCESS_KEY_ID={{ _s3_key }}`), and a guard
      # that flags those is a guard someone disables. Blocks are bounded by INDENTATION — the first
      # version matched any indented line, ran past the task boundary, swallowed the next task and
      # blamed the wrong script.
      # BASH-ONLY SYNTAX NEEDS `executable: /bin/bash`, AND THE FAILURE IS A DEPLOY, NOT A TEST.
      # Ansible's `shell:` runs under /bin/sh — DASH on Ubuntu — which has no `pipefail`, so
      # `set -euo pipefail` dies with `Illegal option -o pipefail` before the task's first real
      # command. It failed the scheduler deploy twice. Verifying the command by hand over ssh
      # cannot catch it, because an interactive ssh lands in bash; only Ansible uses /bin/sh.
      # Two tasks in the playbook already declared bash — the third did not, which is precisely
      # the "a rule written at one call site is not a rule" shape this repo keeps paying for.
      # A SQL DATASOURCE'S DATABASE NAME BELONGS IN jsonData, AND THE WRONG PLACE STILL CONNECTS.
      # Grafana 11+ moved it there. The deprecated top-level `database:` connects fine — the health
      # check says "Database Connection OK" and panels return rows — but the settings UI reads
      # jsonData.database, so the form field renders EMPTY and the page asks you to configure the
      # database. Worse, pressing Save on that page writes the empty field back and takes every
      # Postgres panel down. A working system one click from broken is exactly the shape this repo
      # keeps paying for, so it is a guard rather than a comment.
      - name: Offline check — SQL datasources put the database in jsonData
        run: |
          python3 - <<'PYCHK'
          import glob, sys, yaml
          SQL = ('postgres', 'grafana-postgresql-datasource', 'mysql', 'mssql')
          bad = []
          for path in sorted(glob.glob('stack/observability/grafana/provisioning/datasources/*.yml')):
              doc = yaml.safe_load(open(path)) or {}
              for ds in doc.get('datasources', []) or []:
                  if ds.get('type') not in SQL:
                      continue
                  name = ds.get('name', '?')
                  if 'database' in ds:
                      bad.append(f"{path}: '{name}' sets a TOP-LEVEL `database:` (deprecated; the UI cannot see it)")
                  if not (ds.get('jsonData') or {}).get('database'):
                      bad.append(f"{path}: '{name}' has no `jsonData.database`")
          if bad:
              print('::error::a SQL datasource declares its database in the wrong place')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('  ok  every SQL datasource declares jsonData.database')
          PYCHK
      - name: Offline check — every collector metric is plotted, and every panel is fed
        run: python3 .github/scripts/check_collector_metrics_are_plotted.py

      - name: Offline check — a panel must not filter away the state it reveals
        run: python3 .github/scripts/check_panels_do_not_hide_data.py

      # A panel that cannot RENDER is invisible and nothing reports it. `Sector × facet` selected
      # two columns named `sector` and showed "No Data" from the day PR #261 created it; four
      # facets added in migration 160 were dropped by a panel titled "every facet" and rendered
      # uncoloured in two heatmaps. Every one is a piece of config that ENUMERATES something and
      # went stale — which is why the facet list this guard checks against is parsed out of the
      # migration rather than written here.
      - name: Offline check — every panel can actually render
        run: python3 .github/scripts/check_dashboards_can_render.py

      - name: Offline check — bash-only syntax declares bash
        run: |
          python3 - <<'PYCHK'
          import re, sys, glob
          BASHISMS = ('pipefail', '<(', '>(', '[[ ', 'declare -A', '${!')
          bad = []
          for path in sorted(glob.glob('ansible/*.yml')):
              lines = open(path).read().splitlines()
              # Task blocks are bounded by the `- name:` markers at the same indentation, the same
              # way the Jinja guard above does it: a regex over the whole file runs past the task
              # boundary and blames whichever task happens to follow.
              starts = [i for i, l in enumerate(lines) if re.match(r'\s*- name:', l)]
              for n, i in enumerate(starts):
                  end = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  block = '\n'.join(lines[i:end])
                  hit = next((b for b in BASHISMS if b in block), None)
                  if hit and 'executable: /bin/bash' not in block:
                      bad.append(f"{path}:{i+1}  {lines[i].strip()}  (uses {hit!r})")
          if bad:
              print('::error::a task uses bash-only syntax without `args: executable: /bin/bash`')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('  ok  every task using bash-only syntax declares bash')
          PYCHK
      # THE COLLECTORS ARE REAL FILES, AND THEY MUST COMPILE. `muffin-service-metrics.py` was once
      # an inline `copy: content:` block and its `{{json .}}` format string killed a deploy, because
      # Ansible renders inline content through Jinja. They are `copy: src:` files now — which also
      # means CI can simply run them through the compiler, and a syntax error stops being something
      # you discover on the node.
      - name: Offline check — observability collectors compile
        run: |
          python3 - <<'PYCHK'
          import glob, py_compile, sys
          bad = []
          for path in sorted(glob.glob('stack/observability/collectors/*.py')):
              try:
                  py_compile.compile(path, doraise=True)
              except py_compile.PyCompileError as e:
                  bad.append(f"{path}: {e}")
          if bad:
              print('::error::a collector does not compile')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          n = len(glob.glob('stack/observability/collectors/*.py'))
          print(f'  ok  {n} python collector(s) compile')
          PYCHK
      - name: Offline check — inline-staged scripts are valid Jinja
        run: |
          pip install jinja2 --quiet
          python3 - <<'PY'
          import re, sys, pathlib
          from jinja2 import Environment
          env = Environment()
          lines = pathlib.Path('ansible/muffin_stack.yml').read_text().splitlines()
          bad = []
          for i, line in enumerate(lines):
              m = re.match(r'^(\s*)content: \|\s*$', line)
              if not m:
                  continue
              indent = len(m.group(1))
              block, j = [], i + 1
              while j < len(lines):
                  cur = lines[j]
                  if cur.strip() and (len(cur) - len(cur.lstrip())) <= indent:
                      break
                  block.append(cur)
                  j += 1
              text = "\n".join(block)
              try:
                  env.parse(text)
              except Exception as e:
                  first = next((b.strip() for b in block if b.strip()), '?')
                  bad.append(f"line {i+1} ({first[:50]}): {e}")
          if bad:
              print("::error::inline `copy: content:` that Ansible cannot template — move it to a "
                    "`src:` file, which is copied verbatim:")
              for b in bad:
                  print(f"  {b}")
              sys.exit(1)
          print("ok  every inline-staged script is valid Jinja")
          PY

      - name: Offline check — the quarter-shape threshold separates the two cases
        run: python3 .github/scripts/check_quarter_is_a_quarter.py --self-test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.1"
          # The wrapper rewrites stdout, which makes `fmt -check` output useless.
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Init (no backend — no credentials needed)
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=terraform validate

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ansible-core + pinned collections
        run: |
          pip install ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Syntax check
        # Warns about the missing inventory (manager/workers resolve at deploy
        # time from the cloud.terraform dynamic inventory) and still exits 0 —
        # this validates playbook and role task structure, not connectivity.
        run: ansible-playbook --syntax-check ansible/muffin_stack.yml
