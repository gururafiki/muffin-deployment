name: Quality

# The merge gate for this repo. Until now nothing checked a pull request here:
# deploy.yml only fires on workflow_dispatch / repository_dispatch, so a
# malformed .tf or a broken playbook task was discoverable only by running a
# deploy against the live Oracle node — which is also the thing that once
# replaced the VM and wiped every database.
#
# Everything below runs WITHOUT credentials and WITHOUT touching real infra:
# `terraform init -backend=false` skips the OCI Object Storage backend, and
# `ansible-playbook --syntax-check` needs no inventory or SSH key.
#
# NOTE: deliberately NO `paths` / `paths-ignore` filter. This is a REQUIRED
# status check, and a filtered workflow never reports on a PR that misses the
# filter — leaving the PR blocked on a check that will never arrive.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Apply every migration against a throwaway Postgres, TWICE.
  #
  # This exists because three separate migration defects reached production, and each failed the
  # whole deploy for a reason nothing in CI could see:
  #   * `with_fileglob` returned files unsorted, so 04 ran before 02;
  #   * `create or replace view` cannot rename or reorder columns, only append;
  #   * a foreign key rejected an ISO code the country table did not have (Singapore).
  #
  # The SECOND pass is the important one: these migrations are re-applied on every deploy, so
  # "works on an empty database" is only half the contract. The first pass proves a fresh install,
  # the second proves a redeploy.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations twice
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -q -c \
            "create role anon nologin; create role authenticated nologin;
             create role service_role nologin bypassrls;"

          # 01 and 03 reference auth.users / GoTrue-owned schemas, which only exist in a real
          # Supabase stack — they are applied there after GoTrue has migrated, and cannot be
          # exercised here.
          files=$(ls stack/supabase/migrations/*.sql | grep -vE '/(01|03)-' | sort)

          for pass in 1 2; do
            echo "--- pass $pass ---"
            for f in $files; do
              if ! psql -h localhost -U postgres -q -v ON_ERROR_STOP=1 -f "$f" > /tmp/out 2>&1; then
                echo "::error::$(basename "$f") failed on pass $pass: $(grep -m1 ERROR /tmp/out)"
                exit 1
              fi
            done
            echo "  ok  $(echo "$files" | wc -l | tr -d ' ') migrations"
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.1"
          # The wrapper rewrites stdout, which makes `fmt -check` output useless.
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Init (no backend — no credentials needed)
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=terraform validate

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ansible-core + pinned collections
        run: |
          pip install ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Syntax check
        # Warns about the missing inventory (manager/workers resolve at deploy
        # time from the cloud.terraform dynamic inventory) and still exits 0 —
        # this validates playbook and role task structure, not connectivity.
        run: ansible-playbook --syntax-check ansible/muffin_stack.yml
