# Keep the market caches warm.
#
# Reads are stale-while-revalidate: a reader always gets what is in the table
# instantly, and a stale row triggers a background refresh. That is right for
# latency, but it means the FIRST visitor after a TTL expiry sees the previous
# values until the fetch lands. This nudges the refresh before anyone looks.
#
# WHY EVERY 6 HOURS RATHER THAN EVERY TTL. The TTLs are 30-60 minutes, so a
# per-TTL schedule would be ~48 runs a day against finviz and yfinance — and
# yfinance is known to rate-limit (it started timing out during a day of local
# testing). Four runs a day keep the common case fresh without hammering the
# providers; between runs the SWR path still corrects anything a visitor touches.
#
# CREDENTIAL: the SERVICE-ROLE key. This used to run as anon on a least-privilege
# argument, which stopped being true when refresh became admin-only: the endpoint
# now rejects a plain authenticated JWT, because "any holder of the published anon
# key can spend our provider quota" was a worse problem than the elevated key here.
# `force` is still NOT used — the TTL guard is what keeps a warm-up cheap.
#
# Requires: secret SUPABASE_SERVICE_ROLE_KEY; vars DOMAIN, SUPABASE_SUBDOMAIN
# (default "supabase") — all already present for `deploy`.
name: Market data warm-up

on:
  schedule:
    # 02:10, 08:10, 14:10, 20:10 UTC. Offset off the hour so it does not land with
    # every other cron on the runner fleet.
    - cron: "10 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      resource:
        description: Refresh one resource only (blank = all)
        type: string
        default: ""

# Never overlap: the refresh claim would make a second run a no-op anyway, but
# queuing keeps the logs readable.
concurrency:
  group: market-warmup
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh market data
        env:
          BASE: "https://${{ vars.SUPABASE_SUBDOMAIN || 'supabase' }}.${{ vars.DOMAIN }}"
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONLY: ${{ inputs.resource }}
        run: |
          set -uo pipefail
          if [ -z "${KEY:-}" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set"; exit 1; fi

          # NEWLINE-delimited and read explicitly rather than relying on word
          # splitting of an unquoted variable — that behaviour differs between
          # shells (zsh does not split), which is a silly way for a cron job to
          # start POSTing one resource named "a b c".
          # Cheapest first, so a provider outage does not starve the quick ones.
          if [ -n "${ONLY:-}" ]; then
            RESOURCES="$ONLY"
          else
            # security-tickers is INCREMENTAL: OpenFIGI's anonymous limit means each run
            # resolves ~150 of the backlog, most-visible-first, so it belongs on every pass
            # rather than a slow schedule. fund-holdings has a 7-day TTL and self-skips, so
            # including it here costs one cheap 200 and keeps N-PORT current without a
            # second schedule.
            RESOURCES=$(printf '%s\n' \
              sector-performance \
              country-performance \
              group-performance \
              instrument-performance \
              instrument-profile \
              instrument-prices \
              security-tickers \
              security-profiles \
              security-performance \
              fund-holdings \
              derive-classifications)
          fi

          total=0
          failed=0
          while IFS= read -r r; do
            [ -z "$r" ] && continue
            total=$((total + 1))
            body=$(curl -sS --max-time 240 -w '\n%{http_code}' \
              -X POST "$BASE/functions/v1/market-refresh" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -d "{\"resource\":\"$r\"}" || printf '\n000')
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d' | head -c 300)

            # `skipped` is a SUCCESS: it means the data was already fresh, which is
            # exactly what a warm-up wants to find.
            if [ "$code" = "200" ]; then
              echo "  ok       $r -> $payload"
            else
              echo "::warning::$r failed (HTTP $code): $payload"
              failed=$((failed + 1))
            fi
          done <<EOF
          $RESOURCES
          EOF

          # One provider being down should not fail the whole run — the next warm-up
          # is six hours away and the SWR path still covers real visitors. Fail only
          # if EVERYTHING failed, which means the endpoint or the deployment is down.
          echo "$((total - failed))/$total refreshed"
          if [ "$failed" -eq "$total" ]; then
            echo "::error::every resource failed — market-refresh or the deployment is down"
            exit 1
          fi
