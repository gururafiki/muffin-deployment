# The Dagster instance. Staged to /home/ubuntu/dagster/ by Ansible and bind-mounted read-only into
# all three services, whose container label carries this file's hash so an edit actually restarts
# them — the lesson that cost a day on `security-cn-segments`.

storage:
  postgres:
    postgres_db:
      username: dagster
      password:
        env: DAGSTER_PG_PASSWORD
      hostname: supabase-db
      # ITS OWN DATABASE, NOT ITS OWN SCHEMA. Dagster creates and migrates its tables itself, and
      # `03-security.sql` revokes `public` from `anon`/`authenticated` on every deploy and re-grants
      # only the app's own tables — a run-storage table appearing in `public` would be caught by
      # that machinery on one deploy and dropped from it on the next. A separate database is also
      # what lets `metrics_ro` read run history without being able to see `market`.
      db_name: dagster
      port: 5432

# A STEP'S RAW STDOUT AND STDERR, WHICH UNTIL 2026-09-21 WENT NOWHERE.
#
# Unconfigured, Dagster uses `LocalComputeLogManager` under `$DAGSTER_HOME/storage` — and that
# mount is read-only on purpose (see the telemetry note below), so EVERY step logged
#
#     OSError: [Errno 30] Read-only file system: '/opt/dagster/home/storage'
#
# and captured nothing. Structured logging was unaffected: `context.log.info(...)` is an event row
# in the `dagster` database, which is why the lanes still looked fully instrumented. What was lost
# is the one channel that carries a failure nobody raised — an uncaught library traceback, and the
# dying output of a process the supervisor killed. This deployment's own history is the argument:
# the three supervisor kills (memory, wall clock, CPU) are distinguishable IN THE LOG AND NOWHERE
# ELSE, and a resource died on every invocation for two days before that was read.
#
# A second writable mount rather than loosening the first, for the same reason raw has one.
compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /var/lib/muffin-ingest/compute-logs

# OFF, AND IT IS NOT A PREFERENCE — IT WAS CRASH-LOOPING THE DAEMON. Dagster OSS reports anonymous
# usage telemetry by default and writes its state under `$DAGSTER_HOME`, which is bind-mounted
# READ-ONLY into all three services (the config is staged by Ansible and its hash restarts them):
#
#     OSError: [Errno 30] Read-only file system: '/opt/dagster/home/.telemetry'
#
# The daemon exits 1 on it, so Swarm restarts it, so it exits again. Making the mount writable
# would fix the symptom and hand a read-write DAGSTER_HOME to three containers for the sake of a
# feature this deployment should not be using anyway: it is an internal service on a private
# overlay, and its asset names are this pipeline's schema.
telemetry:
  enabled: false

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

run_launcher:
  module: dagster
  class: DefaultRunLauncher

concurrency:
  # `max_concurrent_runs` LIVES HERE, NOT UNDER `run_coordinator`, AND DECLARING BOTH IS A HARD
  # FAILURE. Dagster sets `using_concurrency_config = "runs" in cfg or "pools" in cfg` and then
  # refuses any `run_coordinator.config.max_concurrent_runs` — so the moment this file declared a
  # pool, the old placement stopped being merely deprecated and became fatal:
  #
  #   DagsterInvalidConfigError: Found config value for `['max_concurrent_runs']` in
  #   `run_coordinator` which is incompatible with the `concurrency > runs` config
  #
  # The daemon crash-looped on it. Read from the installed package's own
  # `_core/instance/config.py` rather than inferred from the message, which names `concurrency >
  # runs` while the conflicting key here was `pools`.
  runs:
    # THREE, and the node is the reason. Each run is a subprocess of the code-location container,
    # and a segment parse costs ~124 MB of RSS, so the container's 2.5 GB is the real bound. The
    # per-provider pools below are what actually serialise work; this only caps the total.
    max_concurrent_runs: 3
  pools:
    # A POOL IS A PROVIDER, and this is what replaces the five-minute pg_cron rotation as the
    # guarantee that nothing bursts. Firing resources back to back is what tripped yfinance's rate
    # limit and negative-cached ~8,300 securities in one afternoon.
    #
    # A pool bounds CONCURRENCY and cannot express a RATE, so requests per second stay with each
    # provider's own pacing (yfinance 4 s a call, OpenFIGI 3 s a page). Both are needed: the pool
    # stops two runs touching one provider at once, the pacing stops one run bursting. (The pacing
    # used to share the job with the ingest ledger's `provider_budget`, retired 2026-10-04.)
    default_limit: 1
    granularity: run

# A RUN THAT HANGS IS ENDED BY DAGSTER, NOT BY SOMEONE NOTICING. With `granularity: run`, a run
# holds its pool slot until it ends, so one stuck provider call blocks every later run on that pool
# for as long as nobody looks. Measured in 1.13.22: the monitor's run-timeout check runs for every
# launcher and terminates through `DefaultRunLauncher.terminate`; only the worker HEALTH check needs
# launcher support, which `DefaultRunLauncher` lacks, so a run whose process died mid-roll is still
# the roll's to fail (`muffin-roll-ingest.sh`).
#
# `max_runtime_seconds` is the DEFAULT for runs with no `dagster/max_runtime` tag: automation and
# backfill runs, whose p99 over 14 days was 211 s. Six hours is far above anything legitimate (the
# longest real run in 30 days is a 43-minute price backfill) and still ends a hang the same night.
# The one longer run on record is the case for it: venue walk `d89bb306` on 2026-09-21 hung for
# 26.8 hours, holding the OpenFIGI pool, until it was failed.
# Scheduled jobs carry their own, tighter tag, set in muffin-ingest from measured run times.
run_monitoring:
  enabled: true
  start_timeout_seconds: 300
  max_runtime_seconds: 21600
