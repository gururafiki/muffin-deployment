# Traefik v3 static configuration for the Muffin Swarm stack.
#
# Rendered by Ansible (`{{ '{{' }} acme_email {{ '}}' }}` is filled from secrets.yaml)
# and bind-mounted into the traefik service at /etc/traefik/traefik.yml.
#
# Dynamic routing is NOT defined here — it comes from `deploy.labels` on the
# agent-chat-ui and langgraph-api services (the Swarm provider, below).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
  # Metrics on their OWN entrypoint, not on websecure. Traefik's Prometheus endpoint carries every
  # router name and request count in the deployment; served on 443 it would be one routing rule
  # away from public. Nothing publishes 8082 to the host (only traefik's 80/443 are published), so
  # this is reachable on the muffin-net overlay and nowhere else.
  metrics:
    address: ":8082"

providers:
  swarm:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false      # services are private unless they opt in with traefik.enable=true
    network: muffin-net
    refreshSeconds: 15

certificatesResolvers:
  cloudflare:
    acme:
      email: "{{ acme_email }}"
      storage: /letsencrypt/acme.json
      # DNS-01 works through Cloudflare's proxy and supports wildcards.
      # The token is provided via CF_DNS_API_TOKEN_FILE (Docker secret) on the service.
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

# Dashboard/API off by default (not exposed). Enable behind auth if you need it.
api:
  dashboard: false
  insecure: false

# Per-router request counts, status codes and latency histograms for every public request — the
# app, the chat UI, the API, Supabase and Studio. This is the only place the request path is
# measured end to end: http-cache sees provider calls and cAdvisor sees containers, but neither
# knows what a visitor experienced.
#
# `addRoutersLabels` is what makes it useful rather than a single global counter, and the label set
# is bounded by the routers defined in this stack, so it cannot grow with traffic.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
