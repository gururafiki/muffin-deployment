# Muffin Agent — Docker Swarm stack (ARM64 / OCI Always-Free single node).
#
# This file is rendered by Ansible (`muffin_stack.yml`) via the `template:` module:
#   {{ '{{' }} ... {{ '}}' }} placeholders are filled from secrets.yaml before
#   `docker stack deploy`. Do not run `docker stack deploy` on this file directly.
#
# Exposure: ONLY `traefik` publishes host ports (80/443). With
# providers.swarm.exposedByDefault=false (see traefik.yml), a service is routable
# only if it carries `traefik.enable=true` labels under `deploy.labels` — which
# only `agent-chat-ui` and `langgraph-api` do. Every MCP / infra service stays
# internal on the `muffin-net` overlay and is unreachable from the internet.
version: "3.8"

# ---------------------------------------------------------------------------
# traefik.yml and config.toml are bind-mounted from /home/ubuntu (staged by
# Ansible) rather than declared as Swarm `configs:` — Swarm configs are immutable
# and break redeploys when the file changes. Bind mounts stay editable (single node).

secrets:
  postgres_password:
    external: true               # docker secret create postgres_password
  firecrawl_postgres_password:
    external: true
  cf_dns_api_token:
    external: true               # Cloudflare Zone:DNS:Edit token for Traefik DNS-01
  portainer_admin_password:
    external: true               # see the note on the portainer service

volumes:
  # Cache entries are rebuildable by definition, but a rebuild costs a full re-fetch at the
  # providers' rate limits — which is the whole reason this exists.
  http-cache-data:
  firecrawl-postgres-data:
  traefik-acme:
  supabase-db-data:
  supabase-db-config:
  supabase-storage-data:
  # Prometheus' TSDB. Rebuildable in the sense that the data can be re-scraped, but the HISTORY
  # cannot — 15 days of per-container memory is exactly what tells you whether today's number is
  # unusual, which is the whole reason any of this exists.
  prometheus-data:
  # Dashboards edited in the UI, users, and the alert rules' state. Provisioned dashboards come
  # from files and would survive without this; anything anyone edits in the browser would not.
  grafana-data:
  portainer-data:

networks:
  muffin-net:
    name: muffin-net             # fixed name (no stack prefix) so Traefik's provider.network matches
    driver: overlay
    attachable: true

# ===========================================================================
services:

  # --- Ingress: the only service exposed to the internet ------------------
  traefik:
    # v3.6.1+ negotiates the Docker API version; older Traefik pins 1.24 which Docker 29
    # (min API 1.40+) rejects, so the swarm provider finds no routers and issues no certs.
    image: traefik:v3.6.1
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - published: 80
        target: 80
        protocol: tcp
        mode: host
      - published: 443
        target: 443
        protocol: tcp
        mode: host
    environment:
      # lego reads the Cloudflare token from this file for the DNS-01 challenge
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token
    secrets:
      - cf_dns_api_token
    volumes:
      - /home/ubuntu/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      - muffin-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 256M
      labels:
        # THE CONFIG'S HASH, IN THE SPEC. traefik.yml is bind-mounted, and a bind-mounted file is
        # not part of a service's spec — so `docker stack deploy` sees no change and traefik keeps
        # serving the OLD static config, silently. Putting the hash here makes an edited
        # traefik.yml a spec change, so exactly the services whose config moved get restarted.
        # This label is inert otherwise: traefik reads OTHER services' labels, never its own.
        - "muffin.config-hash={{ cfg_hash_traefik | default('none') }}"

  # --- LangGraph agent server (EXPOSED via Traefik: api.<domain>) ---------
  langgraph-api:
    image: {{ image_agent }}
    environment:
      # --- wiring (internal service URLs) ---
      REDIS_URI: redis://langgraph-redis:6379
      # LangGraph checkpointer/store DB — Supabase Postgres, unconditionally.
      #
      # This used to be a use_supabase_db conditional whose else-branch pointed at
      # langgraph-postgres. That service was RETIRED on 2026-08-26, so the branch would have
      # resolved to a host that no longer exists — a config that renders fine and fails at
      # runtime. The cutover completed 2026-07-04 and there is nothing to roll back TO: the old
      # volume was verified EMPTY before deletion (0 tables — its pre-cutover contents were
      # already lost in the 2026-07-20 node-replacement incident and it had been re-initialised
      # empty ever since). A dump of it sits in the backups bucket under volumes/ regardless.
      #
      # langgraph-api uses the `postgres` database directly and keeps its tables in `public` —
      # the same database Supabase Studio browses, so LangGraph's data is visible there. (It
      # connects as `postgres` on the default search_path and recreates its tables in public if
      # missing, so a dedicated non-public schema isn't reliable here — see README "LangGraph
      # DB cutover".)
      DATABASE_URI: "postgres://postgres:{{ supabase_db_password }}@supabase-db:5432/postgres?sslmode=disable"
      # Supabase JWT verification (auth.py mode 4): user Bearer tokens minted by GoTrue.
      SUPABASE_URL: "https://{{ supabase_subdomain | default('supabase') }}.{{ domain }}"
      SUPABASE_JWT_SECRET: "{{ supabase_jwt_secret | default('') }}"
      # Sign-in is optional: no credential -> anonymous (Cloudflare Access remains
      # the perimeter); a presented-but-invalid credential still 401s.
      MUFFIN_AUTH_OPTIONAL: "{{ muffin_auth_optional | default('true') }}"
      # Through http-cache so duplicate tool calls across agents collapse to one provider call.
      # Keyed on (tool name, sorted arguments) — the same semantic key the agent-side
      # ToolResultCacheMiddleware uses, one layer lower and shared across processes.
      OPENBB_MCP_URL: "{{ 'http://http-cache:8080/mcp/' if http_cache_enabled | default(true) else 'http://openbb-mcp:8001/mcp' }}"
      OPENSANDBOX_URL: opensandbox-server:8080
      FIRECRAWL_MCP_URL: http://firecrawl-mcp:3000/mcp
      SEARXNG_URL: http://searxng:8080
      # --- secrets (from secrets.yaml) ---
      OPENAI_API_KEY: "{{ openai_api_key | default(openrouter_api_key) }}"
      OPENROUTER_API_KEY: "{{ openrouter_api_key }}"
      OLLAMA_API_KEY: "{{ ollama_api_key | default('') }}"
      LANGSMITH_API_KEY: "{{ langsmith_api_key }}"
      LANGFUSE_SECRET_KEY: "{{ langfuse_secret_key | default('') }}"
      LANGFUSE_PUBLIC_KEY: "{{ langfuse_public_key | default('') }}"
      # --- non-secret config (from config.yml) ---
      # Cross-provider model chain (JSON). Ansible serializes the config.yml
      # `llm_chain:` YAML list → JSON here. When non-empty it supersedes
      # LLM_PROVIDER/MODEL + the per-role *_MODELS chains for every role.
      LLM_CHAIN: '{{ llm_chain | default([]) | to_json }}'
      # Ollama host for the "ollama" provider — native /api/chat (never /v1).
      OLLAMA_BASE_URL: "{{ ollama_base_url | default('https://ollama.com') }}"
      LLM_PROVIDER: "{{ llm_provider | default('openrouter') }}"
      OPENAI_SITE_URL: "{{ openai_site_url | default('https://openrouter.ai/api/v1') }}"
      ORCHESTRATOR_MODELS: "{{ orchestrator_models | default('') }}"
      COLLECTOR_MODELS: "{{ collector_models | default('') }}"
      REASONER_MODELS: "{{ reasoner_models | default('') }}"
      SUMMARISER_MODEL: "{{ summariser_model | default('') }}"
      LLM_SDK_RETRIES: "{{ llm_sdk_retries | default(6) }}"
      TEMPERATURE: "{{ temperature | default(0.1) }}"
      # Global cap on LLM req/s shared by all chat models — keeps the 13-persona council
      # under OpenRouter's free 20/min cap. Blank = no limit. See config.yml.
      LLM_REQUESTS_PER_SECOND: "{{ llm_requests_per_second | default('') }}"
      LANGSMITH_TRACING: "{{ langsmith_tracing | default('false') }}"
      LANGSMITH_ENDPOINT: "{{ langsmith_endpoint | default('https://api.smith.langchain.com') }}"
      LANGSMITH_PROJECT: "{{ langsmith_project | default('muffin') }}"
      LANGFUSE_BASE_URL: "{{ langfuse_base_url | default('https://cloud.langfuse.com') }}"
      # Debug fallback so agent-chat-ui (which doesn't set configurable.user_id)
      # can use persistent memory. Once LangGraph custom auth (auth.py) is wired,
      # REMOVE this for real per-user memory isolation.
      MEMORY_DEBUG_USER_ID: "{{ memory_debug_user_id | default('shared') }}"
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ok')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 3G
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=muffin-net"
        - "traefik.http.routers.api.rule=Host(`{{ api_subdomain | default('api') }}.{{ domain }}`)"
        - "traefik.http.routers.api.entrypoints=websecure"
        - "traefik.http.routers.api.tls.certresolver=cloudflare"
        - "traefik.http.services.api.loadbalancer.server.port=8000"
        # CORS so the browser UIs (different subdomains) can call the API.
        # Web traffic is normally same-origin (each UI proxies /api), but native
        # app builds call the API directly, so allow both UI origins.
        - "traefik.http.routers.api.middlewares=api-cors"
        - "traefik.http.middlewares.api-cors.headers.accessControlAllowOriginList=https://{{ chat_subdomain | default('muffin-chat') }}.{{ domain }},https://{{ app_subdomain | default('muffin') }}.{{ domain }}"
        - "traefik.http.middlewares.api-cors.headers.accessControlAllowMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
        - "traefik.http.middlewares.api-cors.headers.accessControlAllowHeaders=*"
        - "traefik.http.middlewares.api-cors.headers.accessControlAllowCredentials=true"
        - "traefik.http.middlewares.api-cors.headers.accessControlMaxAge=86400"

  # --- Chat UI (EXPOSED via Traefik: chat.<domain>) -----------------------
  agent-chat-ui:
    image: {{ image_ui }}
    environment:
      # Server-side API proxy target (runtime). The UI is built with NEXT_PUBLIC_API_URL=/api, so
      # the browser calls same-origin /api and the Next server proxies here over the overlay.
      LANGGRAPH_API_URL: http://langgraph-api:8000
    networks:
      - muffin-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=muffin-net"
        - "traefik.http.routers.chat.rule=Host(`{{ chat_subdomain | default('muffin-chat') }}.{{ domain }}`)"
        - "traefik.http.routers.chat.entrypoints=websecure"
        - "traefik.http.routers.chat.tls.certresolver=cloudflare"
        - "traefik.http.services.chat.loadbalancer.server.port=3000"

  # --- Muffin app (EXPOSED via Traefik: muffin.<domain>) ------------------
  # New Expo/React Native web client. Static SPA served by nginx, which also
  # reverse-proxies /api → langgraph-api (same-origin, like the chat UI).
  muffin-ui:
    image: {{ image_app }}
    environment:
      # PUBLIC Supabase config injected into the SPA at container start
      # (/runtime-config.js) so the web app knows accounts are enabled without
      # users pasting the anon key. The anon key is a public client key by design.
      SUPABASE_URL: "https://{{ supabase_subdomain | default('supabase') }}.{{ domain }}"
      SUPABASE_ANON_KEY: "{{ supabase_anon_key | default('') }}"
    networks:
      - muffin-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=muffin-net"
        - "traefik.http.routers.app.rule=Host(`{{ app_subdomain | default('muffin') }}.{{ domain }}`)"
        - "traefik.http.routers.app.entrypoints=websecure"
        - "traefik.http.routers.app.tls.certresolver=cloudflare"
        - "traefik.http.services.app.loadbalancer.server.port=80"

  # --- LangGraph state + streaming (internal) -----------------------------

  langgraph-redis:
    image: redis:6
    networks:
      - muffin-net
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 2s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 256M

  # --- Supabase (slim self-host: auth + REST + admin) ----------------------
  # User accounts (GoTrue), RLS'd app tables via PostgREST, and the LangGraph
  # checkpointer DB (dedicated `langgraph` database — see use_supabase_db).
  # Deliberately NOT deployed: realtime, storage, edge-functions, analytics
  # (heavy, unused in M8). Kong is the public API gateway (supabase.<domain>);
  # Studio is admin-only behind Cloudflare Access (supabase-studio.<domain>).
  supabase-db:
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: "{{ supabase_db_password }}"
      POSTGRES_PASSWORD: "{{ supabase_db_password }}"
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: "{{ supabase_jwt_secret }}"
      JWT_EXP: "3600"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    volumes:
      # Init scripts run on FIRST boot only (empty volume); staged by Ansible from
      # stack/supabase/db/ (upstream supabase/docker/volumes/db, verbatim).
      - /home/ubuntu/supabase/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql
      - /home/ubuntu/supabase/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
      - /home/ubuntu/supabase/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql
      - /home/ubuntu/supabase/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
      - supabase-db-data:/var/lib/postgresql/data
      - supabase-db-config:/etc/postgresql-custom
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 1536M

  supabase-auth:
    image: supabase/gotrue:v2.189.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "https://{{ supabase_subdomain | default('supabase') }}.{{ domain }}"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:{{ supabase_db_password }}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: "https://{{ app_subdomain | default('muffin') }}.{{ domain }}"
      # The native app's deep-link scheme MUST be here alongside the web origin.
      # GoTrue validates `redirect_to` at the /callback (not at /authorize), and a
      # redirect that is not on this list is silently replaced by SITE_URL — so
      # Google/GitHub sign-in on iOS/Android would complete, land the in-app browser
      # on the WEB app, never fire `muffinui://`, and leave the user stuck in a
      # webview that never closes. `muffinui` is `expo.scheme` in muffin-ui/app.json;
      # `exp+muffin-ui` is the scheme an Expo dev-client build uses instead.
      GOTRUE_URI_ALLOW_LIST: "https://{{ app_subdomain | default('muffin') }}.{{ domain }}/*,muffinui://**,exp+muffin-ui://**"
      # Trusted hosts for confirmation/recovery links (behind Traefik/Cloudflare the
      # request arrives with X-Forwarded-Host; without this GoTrue logs a warning and
      # falls back to API_EXTERNAL_URL).
      GOTRUE_MAILER_EXTERNAL_HOSTS: "{{ supabase_subdomain | default('supabase') }}.{{ domain }},{{ app_subdomain | default('muffin') }}.{{ domain }}"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: "{{ supabase_jwt_secret }}"
      GOTRUE_JWT_ISSUER: "https://{{ supabase_subdomain | default('supabase') }}.{{ domain }}/auth/v1"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # SMTP is optional (secrets.yaml). Unset -> signups auto-confirm and password
      # recovery is unavailable. Set -> real confirmation/recovery e-mails.
      #
      # EACH FALLS BACK TO THE GENERIC `smtp_*`, which Grafana's alerting also reads. Auth mail and
      # alert mail are the same mailbox in every deployment anyone actually runs, and keeping two
      # copies of one credential is how the two drift — so `supabase_smtp_*` is now an OVERRIDE for
      # the case where GoTrue genuinely needs a different sender, not the place the value lives.
      #
      # `a | default('') or b` and not `a | default(b)`: the keys EXIST in secrets.example.yaml as
      # empty strings, and `default()` only fires on UNDEFINED. An empty string would sail through
      # it and silently disable mail while a perfectly good generic value sat unused.
      GOTRUE_MAILER_AUTOCONFIRM: "{{ 'false' if (supabase_smtp_host | default('') or smtp_host | default('')) else 'true' }}"
      GOTRUE_SMTP_HOST: "{{ supabase_smtp_host | default('') or smtp_host | default('') }}"
      GOTRUE_SMTP_PORT: "{{ supabase_smtp_port | default('') or smtp_port | default('587') }}"
      GOTRUE_SMTP_USER: "{{ supabase_smtp_user | default('') or smtp_user | default('') }}"
      GOTRUE_SMTP_PASS: "{{ supabase_smtp_pass | default('') or smtp_pass | default('') }}"
      GOTRUE_SMTP_ADMIN_EMAIL: "{{ supabase_smtp_admin_email | default('') or smtp_from | default('') or 'no-reply@' ~ domain }}"
      GOTRUE_SMTP_SENDER_NAME: "{{ supabase_smtp_sender_name | default('') or smtp_sender_name | default('Muffin') }}"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      # OAuth providers — each is enabled only when its client id/secret are set
      # in secrets.yaml. Register the OAuth app on the provider's side with the
      # callback https://<supabase_subdomain>.<domain>/auth/v1/callback (see README).
      GOTRUE_EXTERNAL_GITHUB_ENABLED: "{{ 'true' if supabase_github_client_id | default('') else 'false' }}"
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: "{{ supabase_github_client_id | default('') }}"
      GOTRUE_EXTERNAL_GITHUB_SECRET: "{{ supabase_github_secret | default('') }}"
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: "https://{{ supabase_subdomain | default('supabase') }}.{{ domain }}/auth/v1/callback"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "{{ 'true' if supabase_google_client_id | default('') else 'false' }}"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: "{{ supabase_google_client_id | default('') }}"
      GOTRUE_EXTERNAL_GOOGLE_SECRET: "{{ supabase_google_secret | default('') }}"
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: "https://{{ supabase_subdomain | default('supabase') }}.{{ domain }}/auth/v1/callback"
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M

  supabase-rest:
    image: postgrest/postgrest:v14.12
    environment:
      PGRST_DB_URI: postgres://authenticator:{{ supabase_db_password }}@supabase-db:5432/postgres
      # `market` holds the market reference + performance tables (02-market.sql).
      # PostgREST only exposes schemas named here; clients select it with
      # supabase.schema('market') or an `Accept-Profile: market` header.
      PGRST_DB_SCHEMAS: public,graphql_public,market
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "{{ supabase_jwt_secret }}"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: "{{ supabase_jwt_secret }}"
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    command: ["postgrest"]
    networks:
      - muffin-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M

  # Live DB-change subscriptions (websockets). The dotted network alias is
  # load-bearing: Realtime derives its tenant id ("realtime-dev") from the
  # hostname Kong proxies to, matching the SEED_SELF_HOST-seeded tenant.
  supabase-realtime:
    image: supabase/realtime:v2.102.3
    environment:
      PORT: "4000"
      DB_HOST: supabase-db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: "{{ supabase_db_password }}"
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: "{{ supabase_realtime_db_enc_key }}"   # exactly 16 chars (official requirement)
      API_JWT_SECRET: "{{ supabase_jwt_secret }}"
      SECRET_KEY_BASE: "{{ supabase_secret_key_base }}"
      METRICS_JWT_SECRET: "{{ supabase_jwt_secret }}"
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    networks:
      muffin-net:
        aliases:
          - realtime-dev.supabase-realtime
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M

  # S3-like file storage with RLS policies (avatars, exports); files live on the
  # node in the supabase-storage-data volume. imgproxy adds image transforms.
  supabase-storage:
    image: supabase/storage-api:v1.60.4
    environment:
      ANON_KEY: "{{ supabase_anon_key }}"
      SERVICE_KEY: "{{ supabase_service_role_key }}"
      POSTGREST_URL: http://supabase-rest:3000
      AUTH_JWT_SECRET: "{{ supabase_jwt_secret }}"
      DATABASE_URL: postgres://supabase_storage_admin:{{ supabase_db_password }}@supabase-db:5432/postgres
      STORAGE_PUBLIC_URL: "https://{{ supabase_subdomain | default('supabase') }}.{{ domain }}"
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://supabase-imgproxy:5001
    volumes:
      - supabase-storage-data:/var/lib/storage
    networks:
      - muffin-net
    deploy:
      # PINNED because this service owns a NAMED VOLUME, and a local volume lives on ONE
      # node. Without this, adding a worker lets Swarm reschedule the service there, where
      # it gets a BRAND NEW EMPTY volume — for a cache that silently means re-fetching the
      # universe at provider rate limits; for storage it would mean silent data loss.
      # Every other volume-owning service here (supabase-db, firecrawl-postgres, traefik)
      # already carries this constraint.
      placement:
        constraints: [node.role == manager]
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M

  supabase-imgproxy:
    image: darthsim/imgproxy:v3.30.1
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "16.8"
    volumes:
      - supabase-storage-data:/var/lib/storage
    networks:
      - muffin-net
    deploy:
      # PINNED because this service owns a NAMED VOLUME, and a local volume lives on ONE
      # node. Without this, adding a worker lets Swarm reschedule the service there, where
      # it gets a BRAND NEW EMPTY volume — for a cache that silently means re-fetching the
      # universe at provider rate limits; for storage it would mean silent data loss.
      # Every other volume-owning service here (supabase-db, firecrawl-postgres, traefik)
      # already carries this constraint.
      placement:
        constraints: [node.role == manager]
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M

  # Deno serverless functions at /functions/v1/<name>; function sources are
  # staged by Ansible to /home/ubuntu/supabase/functions (main/ is the router).
  supabase-functions:
    image: supabase/edge-runtime:v1.74.0
    environment:
      JWT_SECRET: "{{ supabase_jwt_secret }}"
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: "https://{{ supabase_subdomain | default('supabase') }}.{{ domain }}"
      SUPABASE_ANON_KEY: "{{ supabase_anon_key }}"
      SUPABASE_SERVICE_ROLE_KEY: "{{ supabase_service_role_key }}"
      SUPABASE_DB_URL: postgresql://postgres:{{ supabase_db_password }}@supabase-db:5432/postgres
      # Every upstream is reached through http-cache, which is a read-through cache and nothing
      # else — see stack/proxy/nginx.conf for the TTLs. Unset any of these and that provider is
      # called directly, exactly as before; the defaults in `origins.ts` are the real origins, so
      # removing the cache service cannot take ingestion down.
      OPENBB_API_URL: "{{ 'http://http-cache:8080/openbb' if http_cache_enabled | default(true) else 'http://openbb-api:6900' }}"
      SEC_WWW_BASE_URL: "{{ 'http://http-cache:8080/sec' if http_cache_enabled | default(true) else '' }}"
      SEC_DATA_BASE_URL: "{{ 'http://http-cache:8080/sec-data' if http_cache_enabled | default(true) else '' }}"
      SEC_FTS_BASE_URL: "{{ 'http://http-cache:8080/sec-fts' if http_cache_enabled | default(true) else '' }}"
      OPENFIGI_BASE_URL: "{{ 'http://http-cache:8080/openfigi' if http_cache_enabled | default(true) else '' }}"
      YAHOO_BASE_URL: "{{ 'http://http-cache:8080/yahoo' if http_cache_enabled | default(true) else '' }}"
      ALPHAVANTAGE_BASE_URL: "{{ 'http://http-cache:8080/alphavantage' if http_cache_enabled | default(true) else '' }}"
      TIINGO_BASE_URL: "{{ 'http://http-cache:8080/tiingo' if http_cache_enabled | default(true) else '' }}"
      # OPTIONAL. Without it OpenFIGI allows 25 requests/min x 10 ISINs, so ticker resolution is
      # incremental across runs; a free key raises that to 250 x 100 and finishes the backlog in one.
      OPENFIGI_API_KEY: "{{ openfigi_api_key | default('') }}"
      # Splits and dividends. Absent, `security-corporate-actions` reports it and does nothing
      # rather than failing — the only corporate-action source, so its absence must be legible.
      TIINGO_TOKEN: "{{ tiingo_token | default('') }}"
      # Fundamentals for the securities someone opens. 25 calls a day, US listings only — which is
      # useless as a backlog and ample on demand.
      ALPHA_VANTAGE_API_KEY: "{{ alpha_vantage_api_key | default('') }}"
      VERIFY_JWT: "true"
    volumes:
      - /home/ubuntu/supabase/functions:/home/deno/functions
    command: ["start", "--main-service", "/home/deno/functions/main"]
    networks:
      - muffin-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M

  # Public gateway (EXPOSED via Traefik: supabase.<domain>) — key-auth (anon /
  # service_role) + CORS in front of GoTrue and PostgREST. Config rendered by
  # Ansible from stack/supabase/kong.yml (no runtime env substitution needed).
  supabase-kong:
    image: kong/kong:3.9.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,request-termination,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
    volumes:
      - /home/ubuntu/supabase/kong.yml:/home/kong/kong.yml:ro
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=muffin-net"
        - "traefik.http.routers.supabase.rule=Host(`{{ supabase_subdomain | default('supabase') }}.{{ domain }}`)"
        - "traefik.http.routers.supabase.entrypoints=websecure"
        - "traefik.http.routers.supabase.tls.certresolver=cloudflare"
        - "traefik.http.services.supabase.loadbalancer.server.port=8000"

  supabase-meta:
    image: supabase/postgres-meta:v0.96.6
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: "{{ supabase_db_password }}"
      CRYPTO_KEY: "{{ supabase_pg_meta_crypto_key }}"
    networks:
      - muffin-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M

  # Admin dashboard (EXPOSED via Traefik: supabase-studio.<domain>, behind
  # Cloudflare Access — see terraform/cloudflare.tf).
  supabase-studio:
    image: supabase/studio:2026.06.03-sha-0bca601
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "{{ supabase_db_password }}"
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: "{{ supabase_pg_meta_crypto_key }}"
      # Mirrors supabase-rest so the `market` reference tables (classifications,
      # sectors, countries) are browsable and editable in Studio.
      PGRST_DB_SCHEMAS: public,graphql_public,market
      DEFAULT_ORGANIZATION_NAME: Muffin
      DEFAULT_PROJECT_NAME: Muffin
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: "https://{{ supabase_subdomain | default('supabase') }}.{{ domain }}"
      SUPABASE_ANON_KEY: "{{ supabase_anon_key }}"
      SUPABASE_SERVICE_KEY: "{{ supabase_service_role_key }}"
      AUTH_JWT_SECRET: "{{ supabase_jwt_secret }}"
      ENABLED_FEATURES_LOGS_ALL: "false"
      # THE MOUNT ALONE WAS NOT ENOUGH, AND THE PAGE'S OWN ERROR MESSAGE SENT ME THE WRONG WAY.
      #
      # Studio said "Edge functions could not be read from disk. The functions directory may be
      # missing, not mounted into Studio, or unreadable" — and all three were false. Measured on
      # the node 2026-08-22: the bind mount is present on the running service, and the container
      # lists both `main/` and `market-refresh/` under /home/deno/functions quite happily.
      #
      # The real cause was in Studio's own log, one line:
      #     AssertionError [ERR_ASSERTION]: EDGE_FUNCTIONS_MANAGEMENT_FOLDER is required
      # It never looked, because it was not told where. Read the SERVICE LOG, not the page.
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /home/deno/functions
    volumes:
      # Studio's Functions page reads them off disk. READ-ONLY on purpose: self-hosted Studio
      # cannot deploy a function anyway (Ansible copies them and edge-runtime serves them), so
      # this makes the page work without implying it can write.
      - /home/ubuntu/supabase/functions:/home/deno/functions:ro
    networks:
      - muffin-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=muffin-net"
        - "traefik.http.routers.studio.rule=Host(`{{ studio_subdomain | default('supabase-studio') }}.{{ domain }}`)"
        - "traefik.http.routers.studio.entrypoints=websecure"
        - "traefik.http.routers.studio.tls.certresolver=cloudflare"
        - "traefik.http.services.studio.loadbalancer.server.port=3000"

  # --- Market data: OpenBB MCP (internal) ---------------------------------
  openbb-mcp:
    image: {{ image_openbb }}
    environment:
      # OpenBB provider credentials (from secrets.yaml). The env var is the provider's
      # declared credential name upper-cased — which is NOT always *_API_KEY:
      # tiingo declares `tiingo_token`, cftc declares `cftc_app_token`. Check with
      # `RegistryLoader.from_extensions().providers[<name>].credentials` before adding one.
      FMP_API_KEY: "{{ fmp_api_key | default('') }}"
      FRED_API_KEY: "{{ fred_api_key | default('') }}"
      ALPHA_VANTAGE_API_KEY: "{{ alpha_vantage_api_key | default('') }}"
      TIINGO_TOKEN: "{{ tiingo_token | default('') }}"
      BIZTOC_API_KEY: "{{ biztoc_api_key | default('') }}"
      # WITHOUT THIS THE MCP ENDPOINT IS UNCACHEABLE. Streamable HTTP answers `text/event-stream`
      # by default and a client sending `Accept: application/json` alone gets 406 — the SERVER
      # chooses, so no client can opt in. `openbb-mcp` exposes `--transport` but not this; it is a
      # FastMCP setting. Measured 2026-08-23: langchain-mcp-adapters loads all 219 tools
      # identically either way, so this is invisible to the agent and is what lets http-cache key
      # on (tool, arguments).
      FASTMCP_JSON_RESPONSE: "true"
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8001),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 1536M

  # --- Market data: OpenBB REST API (internal) -----------------------------
  # SAME IMAGE as openbb-mcp — `openbb-core` hard-depends on fastapi/uvicorn, so the
  # OpenBB Platform REST app ships in the image we already build. This is just a
  # second command against it; there is no separate repo, image or CI for this.
  #
  # It exists because the MCP endpoint can only be driven by an MCP client, and the
  # `market-refresh` edge function needs plain HTTP. Route convention is
  # `obb.x.y.z` -> `/api/v1/x/y/z` (278 paths; browsable at /docs, machine-readable
  # at /openapi.json) — but NOTE the convention is not perfectly regular:
  # `/api/v1/equity/price/performance` (slash) vs `/api/v1/etf/price_performance`
  # (underscore). Check /openapi.json before adding a caller.
  #
  # NEVER give this Traefik labels: it has no authentication of any kind and it
  # carries the provider API keys below.
  openbb-api:
    image: {{ image_openbb }}
    command: ["uvicorn", "openbb_core.api.rest_api:app", "--host", "0.0.0.0", "--port", "6900"]
    environment:
      # Same provider credentials as openbb-mcp — keep the two in step. finviz,
      # yfinance and sec need none; FMP is required for per-symbol price performance.
      FMP_API_KEY: "{{ fmp_api_key | default('') }}"
      FRED_API_KEY: "{{ fred_api_key | default('') }}"
      ALPHA_VANTAGE_API_KEY: "{{ alpha_vantage_api_key | default('') }}"
      TIINGO_TOKEN: "{{ tiingo_token | default('') }}"
      BIZTOC_API_KEY: "{{ biztoc_api_key | default('') }}"
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',6900),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 1G

  # --- Self-hosted meta-search (internal) ---------------------------------
  searxng:
    image: searxng/searxng:latest
    volumes:
      - /home/ubuntu/searxng:/etc/searxng:rw   # staged by Ansible
    environment:
      SEARXNG_SECRET_KEY: "{{ searxng_secret_key }}"
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M

  # --- Python sandbox (internal; spawns sibling containers on host Docker) -
  opensandbox-server:
    image: opensandbox/server:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/config.toml:/etc/opensandbox/config.toml:ro
    # config.toml sets [docker].host_ip = docker_gwbridge gateway so the server reaches sandbox
    # published ports; host.docker.internal/host-gateway is NOT resolved under `docker stack deploy`.
    environment:
      SANDBOX_API_KEY: "{{ opensandbox_api_key | default('') }}"
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      # Newer opensandbox refuses to start without an API key unless this ack is set.
      # Safe here: the server is internal-only (no published port; reached only by langgraph-api
      # over the overlay). Set SANDBOX_API_KEY (opensandbox_api_key) to remove the insecure flag.
      OPENSANDBOX_INSECURE_SERVER: "{{ 'YES' if not opensandbox_api_key | default('') else 'NO' }}"
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M

  # --- Firecrawl cluster (all internal) -----------------------------------
  firecrawl-redis:
    image: redis:alpine
    networks:
      - muffin-net
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 2s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 256M

  firecrawl-rabbitmq:
    image: rabbitmq:3
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: "3000"
      BLOCK_MEDIA: "true"
    networks:
      - muffin-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 2G

  firecrawl-postgres:
    # arm64 rebuild of firecrawl's nuq-postgres (upstream ghcr.io/firecrawl/nuq-postgres is
    # amd64-only). Built by muffin-agent CI (.github/workflows/build-nuq-postgres.yml).
    image: {{ image_nuq_postgres }}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/firecrawl_postgres_password
    secrets:
      - firecrawl_postgres_password
    volumes:
      - firecrawl-postgres-data:/var/lib/postgresql/data
    networks:
      - muffin-net
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M

  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl
    command: node dist/src/harness.js --start-docker
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      ENV: production
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      USE_DB_AUTHENTICATION: "false"
      SEARXNG_ENDPOINT: http://searxng:8080
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      NUM_WORKERS_PER_QUEUE: "2"   # lowered from 8 to fit the 24 GB budget
      NUQ_DATABASE_URL: postgresql://postgres:{{ firecrawl_postgres_password }}@firecrawl-postgres:5432/postgres
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          # firecrawl spawns ~10 node workers (api + worker + 5 nuq-workers + prefetch +
          # reconciler + extract); 2G OOM-killed a worker (exit 137). VM has ample headroom.
          memory: 4G

  firecrawl-mcp:
    image: node:22-slim
    command: sh -c "npx --yes firecrawl-mcp"
    environment:
      HTTP_STREAMABLE_SERVER: "true"
      HOST: 0.0.0.0
      PORT: "3000"
      FIRECRAWL_API_URL: http://firecrawl-api:3002
      FIRECRAWL_API_KEY: "{{ firecrawl_api_key | default('local') }}"
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').request({host:'localhost',port:3000,path:'/mcp',method:'POST'},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1)).end()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M

  # --- HTTP cache in front of every external market-data provider (internal) ------
  # Read-through cache. Callers reach a provider through a base URL (`origins.ts`,
  # `OPENBB_API_URL`, `OPENBB_MCP_URL`), so every cache decision lives in nginx.conf and no
  # calling code knows a cache exists.
  #
  # NEVER GIVE THIS TRAEFIK LABELS. It proxies requests carrying provider API keys
  # (alphavantage `apikey=`, tiingo `token=`) and holds their responses on disk.
  #
  # OPENRESTY, NOT nginx, and that is not a preference. The cache key must contain the request
  # body — OpenFIGI POSTs different job arrays to one URL — and plain nginx has two SILENT
  # failures doing that, both measured 2026-08-23: `$request_body` is empty once the body spills
  # to a temp file (a 62 KB body then keyed on the URL alone and served the WRONG cached answer),
  # and a key containing the body can exceed `proxy_buffer_size`, at which point nginx logs an
  # error and stops caching entirely while still answering correctly. Hashing the body in Lua
  # fixes both. See nginx.conf's header.
  http-cache:
    image: openresty/openresty:alpine
    volumes:
      - /home/ubuntu/proxy/nginx.conf:/etc/nginx/conf.d/muffin-cache.conf:ro
      - /home/ubuntu/proxy/openresty.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - http-cache-data:/var/cache/muffin
    networks:
      - muffin-net
    healthcheck:
      # 127.0.0.1, NEVER `localhost`. The container's /etc/hosts maps localhost to BOTH 127.0.0.1
      # and ::1, wget tries the IPv6 entry first, and `listen 8080` binds IPv4 only — so the probe
      # gets "connection refused" while nginx is healthy and listening on 0.0.0.0:8080. Swarm then
      # stops the task, nginx exits 0 on SIGTERM, and the task reads "Complete" with EMPTY logs:
      # a restart loop with no error anywhere. Measured on the node 2026-08-26; Docker Desktop on
      # macOS resolves this differently, so local testing cannot catch it.
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      # PINNED because this service owns a NAMED VOLUME, and a local volume lives on ONE
      # node. Without this, adding a worker lets Swarm reschedule the service there, where
      # it gets a BRAND NEW EMPTY volume — for a cache that silently means re-fetching the
      # universe at provider rate limits; for storage it would mean silent data loss.
      # Every other volume-owning service here (supabase-db, firecrawl-postgres, traefik)
      # already carries this constraint.
      placement:
        constraints: [node.role == manager]
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 192M
      labels:
        # See the note on traefik. Covers nginx.conf AND openresty.conf — the shared dict the
        # /metrics counters live in is declared in the latter, so a change to either has to
        # restart this service or the counters silently do not exist.
        - "muffin.config-hash={{ cfg_hash_http_cache | default('none') }}"

  # ===========================================================================
  # OBSERVABILITY
  #
  # WHY THIS EXISTS AND WHAT IT DELIBERATELY DOES NOT DO.
  #
  # The pipeline's own history lives in Postgres (`market.refresh_run`, `backlog_sample`,
  # `universe_sample`, migration 127) because it is slow, semantic and must outlive any container.
  # Grafana reads it through its Postgres datasource, so NOTHING here exports it — the domain
  # metrics need no exporter at all, which is what keeps this section small.
  #
  # What IS here is the fast, high-cardinality, disposable half that Postgres is the wrong store
  # for: per-container memory, request latency, cache hit ratio.
  #
  # AGENT CALLS ARE NOT HERE ON PURPOSE. LangSmith and Langfuse already receive every LLM call,
  # token count and trace (see langgraph-api's environment above). Rebuilding that locally would
  # cost memory to produce a worse version of something that already works.
  #
  # MEASURED BEFORE ADDING (2026-08-27, on the node): 23,974 MB total, 7,913 used, 16,061
  # available — against ~20.4 GB of declared limits across 26 services, because actual usage runs
  # far under the ceilings. ~1.55 GB of new limits here is comfortable. Re-measure before adding
  # more; this is a single Always-Free node and its documented failure mode is an OOM kill.
  # ===========================================================================

  # --- Metrics store (internal only; never routed) -------------------------
  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 15 DAYS. Long enough to answer "is this normal for a Tuesday" and short enough that the
      # TSDB stays well inside the disk budget. Anything needing a longer memory is a DOMAIN
      # metric and lives in Postgres at 400 days, which is the split this whole section rests on.
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=4GB"
      - "--web.enable-lifecycle"
    volumes:
      - /home/ubuntu/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - muffin-net
    healthcheck:
      # 127.0.0.1, NEVER `localhost` — see the note on http-cache's healthcheck. The container's
      # /etc/hosts maps localhost to ::1 as well, the probe gets connection-refused against an
      # IPv4-only listener, and Swarm reports the resulting restart loop as a clean `Complete`
      # with an empty Error field and no logs at all.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      # PINNED: owns a named volume, and a local volume lives on ONE node. Every volume-owning
      # service in this file carries this for the same reason.
      placement:
        constraints: [node.role == manager]
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M
      labels:
        - "muffin.config-hash={{ cfg_hash_observability | default('none') }}"

  # --- Dashboards + alerting (EXPOSED via Traefik, behind Cloudflare Access) ---
  grafana:
    image: grafana/grafana-oss:12.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password | default('admin') }}"
      GF_SERVER_ROOT_URL: "https://{{ grafana_subdomain | default('muffin-grafana') }}.{{ domain }}"
      # Anonymous access OFF. Cloudflare Access is the perimeter, but a second factor costs
      # nothing here and this UI can reach the database.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Telemetry off, matching traefik's sendAnonymousUsage: false.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # The datasource provisioning file interpolates these rather than carrying the secret, so a
      # rotated password lands with a redeploy and never sits in a bind-mounted YAML file.
      MUFFIN_METRICS_RO_PASSWORD: "{{ metrics_ro_password | default('') }}"
      # --- Alerting by e-mail. Falls back to the generic `smtp_*` exactly as GoTrue does; the two
      # are one mailbox. Unset -> Grafana still RAISES alerts and shows them, it just cannot mail
      # them, which is a degraded mode rather than a broken one.
      GF_SMTP_ENABLED: "{{ 'true' if (smtp_host | default('') and alert_email_to | default('')) else 'false' }}"
      GF_SMTP_HOST: "{{ smtp_host | default('') }}:{{ smtp_port | default('587') }}"
      GF_SMTP_USER: "{{ smtp_user | default('') }}"
      GF_SMTP_PASSWORD: "{{ smtp_pass | default('') }}"
      GF_SMTP_FROM_ADDRESS: "{{ smtp_from | default('no-reply@' ~ domain) }}"
      GF_SMTP_FROM_NAME: "{{ smtp_sender_name | default('Muffin') }}"
      # Read by the contact-point provisioning file.
      MUFFIN_ALERT_EMAIL_TO: "{{ alert_email_to | default('') }}"
    volumes:
      - /home/ubuntu/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - /home/ubuntu/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - muffin-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      placement:
        constraints: [node.role == manager]
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 384M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=muffin-net"
        - "traefik.http.routers.grafana.rule=Host(`{{ grafana_subdomain | default('muffin-grafana') }}.{{ domain }}`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        # Grafana reads its provisioning directory at STARTUP ONLY, so without this a new dashboard
        # or alert rule is staged to the node and never loaded.
        - "muffin.config-hash={{ cfg_hash_observability | default('none') }}"

  # --- Per-CONTAINER cpu/memory/restarts -----------------------------------
  # OCI Monitoring already covers the VM. It cannot see inside a container, and per-container
  # memory is precisely what matters here: openbb-api was OOM-killed at its 1 GB limit by a single
  # exploratory request and took every market tool down with it, while host memory looked fine.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command:
      # cAdvisor's appetite is its known drawback on a small node. `docker_only` drops the raw
      # cgroup hierarchy (which is most of the series and none of the value here) and a 30s
      # housekeeping interval matches the scrape rather than beating it fifteen times over.
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
      # `store_container_labels=false` drops EVERY container_label_*, which silently takes the
      # swarm service name with it — and that is the label every panel and the memory alert group
      # by. Measured: cAdvisor emitted `container_memory_working_set_bytes{id="/"}` and nothing
      # else, so the whole Node & services dashboard was empty while cAdvisor reported healthy.
      # The whitelist is the point of the pair: keep the one label, drop the rest.
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.swarm.service.name"
      - "--disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl"
    volumes:
      # `rslave`, NOT a plain `ro` bind. Docker's data-root is /mnt/data/docker, which is a
      # SEPARATE FILESYSTEM (/dev/sdb) — and a plain bind mount of `/` does not propagate the
      # submounts beneath it, so /rootfs/mnt/data was an empty directory. cAdvisor asks Docker
      # where its root is, looks under /rootfs/mnt/data/docker/image/overlayfs/layerdb/..., finds
      # nothing, and fails to identify EVERY container:
      #   failed to identify the read-write layer ID for container "ae727ab..." -
      #   open /rootfs/mnt/data/docker/image/overlayfs/layerdb/mounts/.../mount-id: no such file
      # It then reports only the root cgroup and looks perfectly healthy doing it.
      - /:/rootfs:ro,rslave
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - muffin-net
    deploy:
      # Reads THIS host's cgroups, so it belongs wherever the containers are. Single node today;
      # a `global` mode would be the change if a worker is ever added.
      placement:
        constraints: [node.role == manager]
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M

  # --- Host cpu/memory/DISK ------------------------------------------------
  # Disk is the reason this is not redundant with OCI. Measured 2026-08-27: `/` is at 70% because
  # Docker uses the containerd image store, so images live under /var/lib/containerd (20 G) rather
  # than the migrated data-root on /mnt/data (9% of 98 G). `daemon.json`'s `data-root` does not
  # control that, and nothing was watching it.
  node-exporter:
    image: prom/node-exporter:v1.10.0
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      # The textfile collector is how anything the host knows and Prometheus cannot scrape gets in
      # — the http-cache volume's size, for one. nginx does not expose it and a cron `du` does.
      # UNDER /host, not a mount of its own. `/:/host:ro` is read-only, so a second bind mounted
      # AT /host/textfile cannot have its mountpoint created inside it — the first deploy failed
      # with `make mountpoint "/host/textfile": read-only file system` and the service restart-
      # looped at 0/1. The directory is already visible through the rootfs mount, so the extra
      # bind was never needed.
      - "--collector.textfile.directory=/host/var/lib/node-exporter"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - muffin-net
    deploy:
      placement:
        constraints: [node.role == manager]
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 64M

  # --- Postgres server internals -------------------------------------------
  # Connections, locks, transaction age, replication — the things that make a deploy hang. A stray
  # exploratory query once held locks for 1,375 seconds and the deploy behind it looked merely
  # slow, because nothing in CI says "blocked on a lock".
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.0
    environment:
      DATA_SOURCE_NAME: "postgresql://metrics_ro:{{ metrics_ro_password | default('') }}@supabase-db:5432/postgres?sslmode=disable"
    networks:
      - muffin-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 64M

  # --- Container operations UI (EXPOSED via Traefik, behind Cloudflare Access) ---
  # NOT a metrics tool and not counted as one: it stores no history. What it buys is that this
  # stack's signature failure — a service at 0/1 with an EMPTY Error field and zero logs — becomes
  # one click instead of an SSH round trip through the maintenance workflow.
  #
  # It holds the DOCKER SOCKET, which is root on the node. Cloudflare Access in front of it is not
  # optional; see terraform/cloudflare.tf, where its hostname is in `cf_hostnames` and therefore
  # gets an Access application, rather than in `cf_public_hostnames`.
  portainer:
    image: portainer/portainer-ce:2.27.9-alpine
    # `--admin-password-file` IS NOT A CONVENIENCE. Portainer CE only accepts the creation of its
    # initial admin account within FIVE MINUTES of first start, then locks itself:
    #
    #   the Portainer instance timed out for security purposes, to re-enable your Portainer
    #   instance, you will need to restart Portainer
    #
    # Measured 2026-08-27 — it started at 11:52 during a deploy, nobody was watching, and by 11:57
    # the UI served nothing but that message. Left unprovisioned, every deploy is a five-minute
    # race against a timer, and losing it means a restart before anyone can log in.
    #
    # Portainer requires at least 12 characters; the generated value is 32 hex.
    command: -H unix:///var/run/docker.sock --admin-password-file /run/secrets/portainer_admin_password
    secrets:
      - portainer_admin_password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - muffin-net
    deploy:
      placement:
        constraints: [node.role == manager]
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=muffin-net"
        - "traefik.http.routers.portainer.rule=Host(`{{ portainer_subdomain | default('muffin-portainer') }}.{{ domain }}`)"
        - "traefik.http.routers.portainer.entrypoints=websecure"
        - "traefik.http.routers.portainer.tls.certresolver=cloudflare"
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"
