# muffin http-cache — a read-through cache in front of every external market-data provider.
#
# WHY IT EXISTS. Re-running an ingestion resource after fixing a parser used to mean re-fetching
# everything from a rate-limited provider, and thirteen council personas asking the same question
# cost thirteen provider calls. Callers reach a provider through a base URL (`origins.ts`), so this
# file owns every cache decision and no calling code knows a cache exists.
#
# KEY RECIPE v1 — method | upstream host | request URI | request body.
# Versioned deliberately: anything that ever wants to match these requests again (a point-in-time
# archive) has to agree with this definition, and a recipe that drifted silently is unmatchable.
#
# FOUR THINGS HERE THAT LOOK LIKE TIDINESS AND ARE NOT:
#
#   1. `inactive=365d` — nginx evicts by LAST ACCESS, not by TTL, and the default is 10 MINUTES.
#      Without this a `proxy_cache_valid 30d` caches nothing while looking perfectly correct. This
#      is the single most likely way this file ships broken.
#   2. `$body_key` is an MD5 COMPUTED IN LUA, not `$request_body`. Two separate silent failures make
#      the obvious `$request_body` wrong, and BOTH were measured on 2026-08-23 rather than guessed:
#        (a) `$request_body` is EMPTY once the body spills past `client_body_buffer_size` to a temp
#            file. A 62 KB body then keys on the URL alone: measured, two DIFFERENT OpenFIGI job
#            arrays collided and the second was served the FIRST one's answer. That is precisely the
#            defect that disqualified Squid (it treats POST as GET), reproduced inside nginx.
#        (b) The key CONTAINS the body, so the key itself can exceed `proxy_buffer_size` (default
#            4k). nginx then logs `... is not enough for cache key` and SILENTLY STOPS CACHING —
#            correct response, no `X-Cache-Status`, an error only in a log nobody reads. Raising the
#            buffer only moves the cliff, because a body can be any size.
#      Hashing fixes both: the Lua reads the temp file when the body spilled, and 32 hex chars can
#      never overflow the key buffer.
#   3. `proxy_cache_lock` — thirteen personas fire the same call at once. Without this every one is
#      a MISS and all thirteen go upstream, which is a thundering herd against the rate limit this
#      cache exists to respect.
#   4. `proxy_ssl_server_name` — without SNI the TLS handshake to SEC/Yahoo fails outright.
#
# WHAT IS DELIBERATELY NOT CACHED: anything that is not a 200. A cached 429 or 5xx is poison, and
# this pipeline has a long history of an empty or throttled response being mistaken for fact. Note
# `proxy_cache_use_stale ... http_429` is the OPPOSITE and is correct — it serves the last GOOD
# response when a provider starts throttling.

proxy_cache_path /var/cache/muffin levels=1:2 keys_zone=muffin:64m
                 inactive=365d max_size={{ http_cache_max_size | default('8g') }} use_temp_path=off;

# The upstream host is in the key because one cache serves many providers; without it two providers
# sharing a path would collide.
proxy_cache_key      "$request_method|$proxy_host|$request_uri|$body_key";
proxy_cache_methods  GET HEAD POST;
proxy_cache          muffin;
proxy_cache_lock     on;
proxy_cache_lock_timeout 30s;
proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
proxy_cache_background_update on;

# Providers send `no-cache`; ignoring those headers stops them PREVENTING caching. It does not by
# itself cache anything — `proxy_cache_valid` is what does that.
proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires;

# OpenFIGI job arrays are a few KB. 1m is ample; see note 2 above for why the margin matters.
client_body_buffer_size 1m;
client_max_body_size    8m;

# Docker's embedded DNS. Upstream names are resolved at runtime, so a provider changing IP does not
# need a reload.
resolver 127.0.0.11 ipv6=off valid=30s;

proxy_ssl_server_name on;
proxy_http_version    1.1;
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Observability: every response says whether it was served from cache. The callers and the
# verification job read THIS rather than trusting the proxy's own counters.
add_header X-Cache-Status $upstream_cache_status always;
add_header X-Cache-Key-Recipe "v1" always;

log_format cache '$time_iso8601 $upstream_cache_status $request_method $host$request_uri '
                 '-> $status ${bytes_sent}b ${request_time}s';
access_log /dev/stdout cache;   # container: docker service logs is the only reader

server {
    listen 8080;
    server_name _;

    # Hash the request body into $body_key. See note 2 in the header for the two measured failures
    # this replaces. Runs for EVERY request; a GET simply has no body and hashes to "".
    set $body_key "";
    access_by_lua_block {
        if ngx.req.get_method() == "POST" then
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            if not body then
                -- Body spilled to a temp file because it exceeded client_body_buffer_size. This is
                -- the branch that, left unhandled, silently keys every large POST on the URL alone.
                local path = ngx.req.get_body_file()
                if path then
                    local fh = io.open(path, "rb")
                    if fh then body = fh:read("*a"); fh:close() end
                end
            end
            if body then ngx.var.body_key = ngx.md5(body) end
        end
    }

    # Never cached: a liveness probe that reported a cached answer would be useless.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---- SEC -------------------------------------------------------------------------------
    # Bulk files and the EDGAR archives. `company_tickers.json` is 776 KB and byte-identical most
    # days; N-PORT primary_doc.xml changes quarterly. Long TTLs are correct here.
    location /sec/ {
        set $up "www.sec.gov";
        rewrite ^/sec/(.*)$ /$1 break;
        proxy_pass https://$up;
        proxy_set_header Host www.sec.gov;
        proxy_cache_valid 200 30d;
    }
    # Submissions and XBRL companyfacts (~3.6 MB/filer, changes only when a company files).
    location /sec-data/ {
        set $up "data.sec.gov";
        rewrite ^/sec-data/(.*)$ /$1 break;
        proxy_pass https://$up;
        proxy_set_header Host data.sec.gov;
        proxy_cache_valid 200 7d;
    }
    # Full-text search — how a fund's filing is found. Funds file quarterly.
    location /sec-fts/ {
        set $up "efts.sec.gov";
        rewrite ^/sec-fts/(.*)$ /$1 break;
        proxy_pass https://$up;
        proxy_set_header Host efts.sec.gov;
        proxy_cache_valid 200 7d;
    }

    # ---- OpenFIGI (POST) -------------------------------------------------------------------
    # An ISIN->ticker mapping is effectively permanent, and the anonymous rate limit is 25 req/min,
    # so this is the highest-value TTL in the file.
    location /openfigi/ {
        set $up "api.openfigi.com";
        rewrite ^/openfigi/(.*)$ /$1 break;
        proxy_pass https://$up;
        proxy_set_header Host api.openfigi.com;
        proxy_cache_valid 200 90d;
    }

    # ---- Yahoo -----------------------------------------------------------------------------
    # Prices move; an ISIN->symbol resolution does not. Split so the short TTL does not punish the
    # part that is stable.
    location /yahoo/v1/finance/search {
        set $up "query2.finance.yahoo.com";
        rewrite ^/yahoo/(.*)$ /$1 break;
        proxy_pass https://$up;
        proxy_set_header Host query2.finance.yahoo.com;
        proxy_cache_valid 200 30d;
    }
    location /yahoo/ {
        set $up "query2.finance.yahoo.com";
        rewrite ^/yahoo/(.*)$ /$1 break;
        proxy_pass https://$up;
        proxy_set_header Host query2.finance.yahoo.com;
        proxy_cache_valid 200 1h;
    }

    # ---- Alpha Vantage ---------------------------------------------------------------------
    # 25 calls a DAY. Historical EPS for a closed quarter never changes, so a long TTL here buys
    # back more budget than anything else in this file.
    location /alphavantage/ {
        set $up "www.alphavantage.co";
        rewrite ^/alphavantage/(.*)$ /$1 break;
        proxy_pass https://$up;
        proxy_set_header Host www.alphavantage.co;
        proxy_cache_valid 200 30d;
    }

    # ---- Tiingo ----------------------------------------------------------------------------
    # Splits and dividends for a past window are immutable; the binding limit is unique SYMBOLS
    # touched, not requests, so caching keeps a re-run from spending new symbols.
    location /tiingo/ {
        set $up "api.tiingo.com";
        rewrite ^/tiingo/(.*)$ /$1 break;
        proxy_pass https://$up;
        proxy_set_header Host api.tiingo.com;
        proxy_cache_valid 200 7d;
    }

    # ---- openbb-mcp (JSON-RPC over streamable HTTP) ----------------------------------------
    # This is what replaces the agent's store-backed ToolResultCacheMiddleware: it keys on
    # (tool name, arguments), the SAME semantic key that middleware used, one layer lower and
    # shared by every agent and process.
    #
    # THREE THINGS MAKE THIS DIFFERENT FROM AN ORDINARY POST CACHE, all measured 2026-08-23:
    #
    #  1. The server must be in JSON mode. Streamable HTTP answers `text/event-stream` by default
    #     and a client sending `Accept: application/json` alone gets 406 — so the CLIENT cannot opt
    #     in. `FASTMCP_JSON_RESPONSE=true` on openbb-mcp flips it; verified that
    #     langchain-mcp-adapters loads all 219 tools identically either way.
    #  2. The body carries an incrementing `"id"`, so hashing the raw body gives a unique key per
    #     call and a 0% hit rate. The key is built from `params.name` + sorted `params.arguments`.
    #  3. A JSON-RPC response ECHOES the request id. A cached body therefore carries the id of
    #     whoever missed first, and the client cannot correlate it. The response id is rewritten on
    #     the way out. Without this the cache returns correct DATA under the wrong envelope, which
    #     is worse than a miss because the client hangs rather than erroring.
    #
    # Only `tools/call` is cached. `initialize` and `tools/list` are session-scoped and pass
    # through — caching either corrupts the session rather than degrading.
    location /mcp/ {
        set $up "openbb-mcp:8001";
        set $mcp_bypass "1";
        set $mcp_req_id "";
        rewrite ^/mcp/?(.*)$ /mcp break;

        access_by_lua_block {
            local cjson = require "cjson.safe"
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            if not body then
                local f = ngx.req.get_body_file()
                if f then local fh = io.open(f, "rb")
                         if fh then body = fh:read("*a"); fh:close() end end
            end
            if not body then return end
            local msg = cjson.decode(body)
            if type(msg) ~= "table" or msg.method ~= "tools/call" then return end
            local p = msg.params or {}
            if type(p.name) ~= "string" then return end

            -- Canonical, key-sorted rendering of the arguments. cjson does not sort, and two
            -- semantically identical calls whose JSON key order differs must share a cache entry.
            local function canon(v)
                local t = type(v)
                if t ~= "table" then return cjson.encode(v) end
                if v[1] ~= nil or next(v) == nil then          -- array (order is meaningful)
                    local out = {}
                    for i = 1, #v do out[i] = canon(v[i]) end
                    return "[" .. table.concat(out, ",") .. "]"
                end
                local keys = {}
                for k in pairs(v) do keys[#keys + 1] = k end
                table.sort(keys)
                local out = {}
                for i, k in ipairs(keys) do out[i] = cjson.encode(k) .. ":" .. canon(v[k]) end
                return "{" .. table.concat(out, ",") .. "}"
            end

            ngx.var.body_key  = ngx.md5(p.name .. "\0" .. canon(p.arguments or {}))
            ngx.var.mcp_bypass = ""
            ngx.var.mcp_req_id = tostring(msg.id)
        }

        # The rewritten id can be a DIFFERENT LENGTH than the cached one (7 -> 99), so the
        # upstream Content-Length becomes a lie and the client truncates the body into invalid
        # JSON. Measured: it is silent under a client whose ids happen to be the same width, which
        # is exactly what a same-session test produces. Dropping the header forces chunked
        # encoding and the body length stops being asserted anywhere.
        header_filter_by_lua_block {
            if ngx.var.mcp_bypass == "" and ngx.var.mcp_req_id ~= "" then
                ngx.header.content_length = nil
            end
        }

        # Rewrite the echoed JSON-RPC id so a cached body correlates with THIS request. Buffered
        # rather than streamed because the id must be replaced before the client sees any of it.
        body_filter_by_lua_block {
            if ngx.var.mcp_bypass ~= "" or ngx.var.mcp_req_id == "" then return end
            local chunk, eof = ngx.arg[1], ngx.arg[2]
            local buf = ngx.ctx.buf or {}
            if chunk ~= "" then buf[#buf + 1] = chunk; ngx.ctx.buf = buf end
            if not eof then ngx.arg[1] = nil; return end
            local whole = table.concat(buf)
            -- The envelope is {"jsonrpc":"2.0","id":N,...} — id precedes `result`, so the FIRST
            -- match is always the envelope's and never one inside a tool payload.
            ngx.arg[1] = (whole:gsub('("id"%s*:%s*)%-?%d+', "%1" .. ngx.var.mcp_req_id, 1))
        }

        proxy_pass http://$up;
        proxy_set_header Host openbb-mcp;
        proxy_no_cache     $mcp_bypass;
        proxy_cache_bypass $mcp_bypass;
        proxy_cache_valid  200 1h;
    }

    # ---- openbb-api (internal, plain HTTP) -------------------------------------------------
    # Short by default because most of these carry a rolling `start_date`. Phase 2 splits this by
    # whether the request names an explicit end date. Caching here also relieves a measured
    # bottleneck: openbb-api SERIALISES concurrent requests (3 parallel calls for one security took
    # 5.53s against 5.58s serial), so a hit saves far more than the network time.
    location /openbb/ {
        set $up "openbb-api:6900";
        rewrite ^/openbb/(.*)$ /$1 break;
        proxy_pass http://$up;
        proxy_cache_valid 200 1h;
    }
}
