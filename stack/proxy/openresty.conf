# Minimal OpenResty main config. Everything muffin-specific lives in muffin-cache.conf; this file
# exists only because the stock image's default nginx.conf pulls in a demo server on :80.
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Counters for /metrics, declared here because `lua_shared_dict` is an http-level directive and
    # muffin-cache.conf is included INSIDE this block. 10m holds far more series than this can
    # produce: the label set is (provider x cache_status x status_class), which is bounded by the
    # nine locations in that file and cannot grow with traffic.
    #
    # Shared across workers and LOST ON RELOAD, which is correct for what these are: Prometheus
    # counters are `_total` and it handles a reset natively. Nothing here is a source of truth —
    # the cache itself is on disk.
    lua_shared_dict muffin_metrics 10m;

    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/muffin-cache.conf;
}
