# Prometheus scrape config for the muffin stack.
#
# WHAT IS DELIBERATELY ABSENT: anything about backlogs, run outcomes or the size of the universe.
# Those live in Postgres (`market.refresh_run`, `backlog_sample`, `universe_sample` — migration
# 127) and Grafana reads them through its Postgres datasource. Exporting them here would mean a
# second copy with a shorter retention and a sampling rate that hides the very stalls it exists to
# show, and the domain history has to outlive any container.
#
# Every target is resolved by Docker's embedded DNS on the muffin-net overlay. None is published to
# the host and none is routed through Traefik.

global:
  # 30s rather than the usual 15s. Nothing here changes faster than that — cAdvisor's own
  # housekeeping is 30s, so a 15s scrape would return the same numbers twice and double the TSDB
  # for nothing. This is a 4-OCPU Always-Free node.
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    deployment: muffin

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Host cpu/memory/disk, PLUS per-service memory and CPU through the textfile collector — see
  # the note on node-exporter in docker-compose.yaml for why cAdvisor is not here.
  # Disk is the reason this is not redundant with OCI Monitoring: `/` sits at
  # 70% because images live under /var/lib/containerd, which the data-root move did not cover.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Provider calls: volume, cache hit ratio, latency and status class per provider.
  # See stack/proxy/nginx.conf — the counters are Lua in a `log_by_lua_block`, and the KNOWN blind
  # spot is that openbb-api's own outbound yfinance/finviz/FMP calls do not pass through the proxy.
  - job_name: http-cache
    static_configs:
      - targets: ["http-cache:8080"]

  # Per-router request rate, status codes and latency for every PUBLIC request.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  # Postgres server internals — connections, locks, transaction age. Connects as `metrics_ro`.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # NOT YET. The ingestion worker will expose its own view of every provider call — requests,
  # THE WORKER'S OWN PROVIDER COUNTERS, and the one place they can be counted.
  #
  # `http-cache` sits in FRONT of openbb-api, and openbb's egress does not pass through it —
  # yfinance fetches via `curl_cffi` and ignores our base URLs. Importing the hub in-process moved
  # that blind spot inside our own worker; `muffin_ingest.metrics` closes it.
  #
  # This job shipped COMMENTED OUT because it pointed at a port nothing listened on, and a
  # permanently-red target is the same failure as a permanently-red gate. It comes back with the
  # exporter that serves it.
  #
  # A CORRECTION TO WHAT THIS COMMENT USED TO SAY. It claimed the exporter "needs
  # `mark_process_dead` on run exit or the per-PID files grow without bound". That is wrong, read
  # from the installed package rather than assumed: `mark_process_dead` globs
  # `gauge_{mode}_{pid}.db` and nothing else, because a counter's value must outlive the process
  # that produced it. Measured — three children, each calling it on exit, left six files. What
  # bounds the directory is the exporter CLEARING it at startup, which `prometheus_client`
  # requires anyway: files surviving a restart are summed and served as current.
  - job_name: muffin-ingest
    static_configs:
      - targets: ["muffin-ingest:9102"]

