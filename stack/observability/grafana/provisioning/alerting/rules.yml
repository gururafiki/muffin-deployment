apiVersion: 1
groups:
- orgId: 1
  name: muffin
  folder: Muffin
  interval: 10m
  rules:
  - uid: muffin-resource-stalled
    title: A refresh resource has stopped succeeding
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-postgres
      model:
        refId: A
        format: table
        rawQuery: true
        rawSql: "select count(*)::float8 as value\n  from (\n    select resource,\n           min(started_at)                    as first_seen,\n           max(finished_at) filter (where ok and not skipped) as last_ok\n\
          \      from market.refresh_run\n     -- AND NOT SKIPPED. A skip is a successful invocation that did no work, and a worker killed
     -- by the supervisor holds the in-flight lock for ~2 minutes — so anything that pokes a dead
     -- resource inside that window gets a skip, and the skip would refresh `last_ok`. Measured
     -- 2026-09-01: security-segments had been dead for two days, this rule was correctly firing,
     -- and three diagnostic calls that all returned `skipped` would have silenced it.
     -- INVESTIGATING AN ALERT MUST NOT BE ABLE TO CLEAR IT.
     -- 30 days, not 12 hours: a resource that broke a week ago must still be counted, and a\n     -- window as short as the threshold can only ever see resources\
          \ already running.\n     where started_at > now() - interval '30 days'\n     group by resource\n  ) t\n -- COLD-START GUARD. A resource we have only been recording for an hour CANNOT have been\n\
          \ -- broken for twelve, and without this every fresh deployment fires this alert for its first\n -- half-day — which is exactly how the first alert anyone sees becomes one they ignore.\n -- Observed\
          \ on 2026-08-27: it fired on three resources that had genuinely failed inside a\n -- deploy window and already recovered, because 73 minutes of history cannot contain a\n -- 12-hour success.\n\
          \ where first_seen < now() - interval '8 hours'\n   and (last_ok is null or last_ok < now() - interval '8 hours')"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: Alerting
    execErrState: Alerting
    for: 15m
    labels:
      muffin: pipeline
    annotations:
      summary: '{{ $values.B }} refresh resource(s) have not succeeded in 12 hours'
      description: EIGHT hours, tightened from twelve. Twelve was calibrated for GitHub Actions, whose scheduled runs were 19-127 minutes late with gaps up to 13.3 HOURS — the alert window had to exceed
        the scheduler's own unreliability or it would have fired on that instead. The pg_cron rotation completes a sweep every 3.2 hours, so 8 hours is two missed sweeps and means something again. A resource
        is only judged once it has been RECORDED for longer than the threshold, so a newly added one is exempt for its first 8 hours.
  - uid: muffin-scheduler-silent
    title: The scheduler has stopped firing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-postgres
      model:
        refId: A
        format: table
        rawQuery: true
        rawSql: "select coalesce(max(value), 9999)::float8 as value\n  from market.universe_sample\n where metric = 'scheduler.minutes_since_tick'\n   and sampled_at = (select max(sampled_at) from market.universe_sample)"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 30
    noDataState: Alerting
    execErrState: Alerting
    for: 15m
    labels:
      muffin: pipeline
    annotations:
      summary: pg_cron last fired {{ $values.B }} minutes ago (expected every 5)
      description: 'THIS IS THE ALERT THAT REPLACES GITHUB''S OWN VISIBILITY. Moving the warm-up into pg_cron removed the last external scheduler, so nothing else drives the pipeline and the failure mode
        is SILENT — the data simply stops being refreshed while every count stays plausible for days. The rotation fires every 5 minutes; past 30 it has stopped. `coalesce(..., 9999)` is deliberate: NO
        ROW means the sampler itself is not running, which is the same emergency, and must not read as healthy. Check `select * from cron.job_run_details order by start_time desc limit 20` on the node.'
  - uid: muffin-backlog-stalled
    title: A backlog is not draining while its runs report success
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-postgres
      model:
        refId: A
        format: table
        rawQuery: true
        rawSql: "select count(*)::float8 as value\n  from (\n    select backlog, max(depth) - min(depth) as spread, count(*) as samples\n      from market.backlog_sample\n     where sampled_at > now() -\
          \ interval '24 hours'\n       and error is null\n     group by backlog\n    -- An empty or nearly-empty backlog is legitimately flat. 500 is well above the noise and\n    -- well below the populations\
          \ that have actually stalled here (7,175 / 9,698 / 10,074).\n    having max(depth) > 500\n  ) t\n -- EXACTLY zero movement across a full day of samples. A backlog that is merely slow moves.\n\
          \ where spread = 0 and samples >= 8"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: Alerting
    execErrState: Alerting
    for: 1h
    labels:
      muffin: pipeline
    annotations:
      summary: '{{ $values.B }} backlog(s) have not moved in 24 hours'
      description: 'THE STALL SIGNATURE, and the reason this whole thing was built. It has happened five times: pending_industry re-fetched the same top-300 for months, security-share-stats returned ''stats:
        0, remaining: 11136'' on eight consecutive runs, the FX history probe re-read its own page, the EPS backlog re-asked the same head, and derive_security_metrics returned byte-identical results twice.
        Every one reported success and a `written` that looked like throughput. Check refresh_run.report for that backlog''s resource.'
  - uid: muffin-negative-cache-jump
    title: A negative cache grew sharply
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-postgres
      model:
        refId: A
        format: table
        rawQuery: true
        rawSql: "with ranked as (\n  select metric, value,\n         row_number() over (partition by metric order by sampled_at desc) as rn\n    from market.universe_sample\n   where metric like 'missing.%'\n\
          \     and sampled_at > now() - interval '6 hours'\n)\nselect count(*)::float8 as value\n  from (\n    select metric,\n           max(value) filter (where rn = 1) as newest,\n           max(value)\
          \ filter (where rn = 2) as prev\n      from ranked\n     group by metric\n  ) t\n -- A small population can double for entirely ordinary reasons; 100 is the floor below which\n -- a jump says\
          \ nothing.\n where prev > 100 and newest > prev * 1.2"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: Alerting
    execErrState: Alerting
    for: 15m
    labels:
      muffin: pipeline
    annotations:
      summary: '{{ $values.B }} negative cache(s) grew more than 20% in one sampling interval'
      description: A *_missing_at column records 'we asked and the provider has nothing'. A SPIKE means a provider outage or rate limit is being written down as a permanent fact about thousands of securities.
        On 2026-08-13 ~8,300 were marked this way in a single afternoon — INTC, PEP, XOM and REGN among them — and every other count stayed plausible throughout. See the market-repair-negative-cache skill
        before clearing anything.
  - uid: muffin-container-near-oom
    title: A container is near its memory limit
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-prometheus
      model:
        refId: A
        expr: muffin_service_memory_bytes / muffin_service_memory_limit_bytes * 100
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
    noDataState: NoData
    execErrState: Alerting
    for: 10m
    labels:
      muffin: infra
    annotations:
      summary: '{{ $labels.service }} is at {{ $values.B }}% of its memory limit'
      description: 'Per-service, because the HOST looks fine when this happens. openbb-api was OOM-killed at its 1 GB limit by one exploratory request and every market tool went with it. Measured 2026-08-27:
        supabase-kong at 83.2% of its 512 MB and firecrawl-api at 70.2% of 4 GB, so this is not hypothetical. Sourced from `docker stats` via node-exporter, not cAdvisor, which cannot identify a container
        under Docker''s containerd image store.'
  - uid: muffin-cache-hit-ratio-collapsed
    title: The provider cache has stopped serving hits
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-prometheus
      model:
        refId: A
        expr: sum(rate(muffin_provider_requests_total{cache_status="HIT"}[1h])) / clamp_min(sum(rate(muffin_provider_requests_total{cache_status=~"HIT|MISS|EXPIRED|STALE"}[1h])), 0.0001) * 100
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 5
    noDataState: NoData
    execErrState: Alerting
    for: 6h
    labels:
      muffin: infra
    annotations:
      summary: Cache hit ratio has been under 5% for 6 hours
      description: Both ways this breaks are SILENT BY DESIGN. `inactive=` evicts by last access and defaults to 10 minutes, so a `proxy_cache_valid 30d` caches nothing while looking correct; and a cache
        key larger than proxy_buffer_size makes nginx log one line and stop caching while still answering. The only symptom of either is a provider rate limit nobody connects to it. `clamp_min` keeps a
        quiet period from dividing by zero.
  - uid: muffin-disk-filling
    title: A filesystem is over 80% full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-prometheus
      model:
        refId: A
        expr: max by (mountpoint) (  100 - (node_filesystem_avail_bytes{mountpoint=~"/|/mnt/data"}         / node_filesystem_size_bytes{mountpoint=~"/|/mnt/data"} * 100))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 80
    noDataState: NoData
    execErrState: Alerting
    for: 30m
    labels:
      muffin: infra
    annotations:
      summary: '{{ $labels.mountpoint }} is {{ $values.B }}% full'
      description: '`/` was already at 70% on 2026-08-27 and grows with every image pull: Docker uses the containerd image store, so images live in /var/lib/containerd (20 G) rather than the migrated data-root
        on /mnt/data (9% of 98 G), and daemon.json''s `data-root` does not control it. Cheap relief: `docker image prune -a` and reclaim the stale /var/lib/docker. The real fix is containerd''s own `root`
        — see todos.md.'
  - uid: muffin-data-defect
    title: A data-correctness invariant is broken
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-postgres
      model:
        refId: A
        format: table
        rawQuery: true
        rawSql: "select count(*)::float8 as value\n  from market.universe_sample\n where sampled_at = (select max(sampled_at) from market.universe_sample\n                      where metric like 'defect.%')\n\
          \   and metric like 'defect.%'\n   -- `extreme_1y_returns` is a GAUGE, not an invariant: of 40 securities returning >= +300%,\n   -- 34 were REAL (SNDK +2,692%, MU +580%). Asserting zero on it\
          \ would cry wolf for ever.\n   and metric <> 'defect.extreme_1y_returns'\n   and value > 0"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: Alerting
    execErrState: Alerting
    for: 15m
    labels:
      muffin: data-quality
    annotations:
      summary: '{{ $values.B }} data-correctness invariant(s) are non-zero'
      description: Each of these was a REAL defect that returned HTTP 200 while corrupting data. The all-zero CUSIP placeholder merged Accenture, Seagate, TE Connectivity and NXP into ONE security. Duplicate
        constituents double-counted the sector donut while the percentages still looked right, because renormalising cancels a uniform double count. A zero close made 154 securities read -100% on all seven
        periods. Query `market.data_defect` for which one and its detail. Until now these were checked once a night and kept only a pass/fail bit.
  - uid: muffin-metric-unit-flip
    title: A metric's median moved by more than 3x
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-postgres
      model:
        refId: A
        format: table
        rawQuery: true
        rawSql: "-- Compares the newest sample of each metric's p50 against the previous one. A unit change is\n-- the only thing that moves a median 100x overnight; real drift moves it a few percent.\n\
          with s as (\n  select metric, value,\n         row_number() over (partition by metric order by sampled_at desc) as rn\n    from market.universe_sample\n   where metric like 'dist.%.p50' and sampled_at\
          \ > now() - interval '2 days'\n)\nselect count(*)::float8 as value from (\n  select metric,\n         max(value) filter (where rn = 1) as newest,\n         max(value) filter (where rn = 2) as\
          \ prev\n    from s group by metric\n) q\n where prev is not null and newest is not null\n   and abs(prev) > 0.000001\n   and (newest / prev > 3 or newest / prev < 0.333)"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: Alerting
    execErrState: Alerting
    for: 15m
    labels:
      muffin: data-quality
    annotations:
      summary: '{{ $values.B }} metric median(s) moved more than 3x since the last sample'
      description: 'THE UNIT-FLIP TRIPWIRE. The fraction/percent confusion has hit this schema three separate times: OpenBB returning performance as a fraction (-0.0366 meaning -3.66%), the shared pct()
        that rendered NVIDIA at a 46% dividend yield — wrong by two orders of magnitude and entirely plausible-looking — and surprise_percent. Every one was invisible per row and obvious in the aggregate,
        which is why this watches the MEDIAN rather than any value. Compare `dist.<code>.p50` across the last two samples.'
  - uid: muffin-backlog-marking
    title: A backlog is draining by MARKING rather than by working
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-postgres
      model:
        refId: A
        format: table
        rawQuery: true
        rawSql: select count(*) as value from market.backlog_drain where state = 'draining_by_marking'
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: Alerting
    execErrState: Alerting
    for: 1h
    labels:
      muffin: pipeline
    annotations:
      summary: '{{ $values.B }} backlog(s) have not moved in 24 hours'
      description: 'The 2026-08-13 signature: `pending_industry` reached zero while ~8,300 securities were being negative-cached as permanently unanswerable, and every count read as progress. A backlog
        whose depth falls while its matching `*_missing_at` population rises at a comparable rate is not draining — it is being emptied by exclusion. Its depth curve is identical to a healthy drain, so
        this is the only way to tell them apart.


        RUNBOOK: read the `market-repair-negative-cache` skill BEFORE clearing anything — an earned mark and one caused by a provider outage look identical in every count, and clearing an earned one re-asks
        a rate-limited provider for an answer already held.'
  - uid: muffin-backlog-flat
    title: A non-empty backlog has been FLAT for a week
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-postgres
      model:
        refId: A
        format: table
        rawQuery: true
        rawSql: select count(*) as value from market.backlog_drain where state = 'FLAT' and depth > 100
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: Alerting
    execErrState: Alerting
    for: 1h
    labels:
      muffin: pipeline
    annotations:
      summary: '{{ $values.B }} backlog(s) have not moved in 24 hours'
      description: 'The stall signature, seven occurrences. `security-statements` returned `written: 240, remaining: 8668` byte-identical on five consecutive runs while reporting ok, and `security-eps-history`
        sat at 300 re-asking an exhausted quota. Both were found by eye.


        A `written` that looks like throughput and never moves is this system''s most reliable disguise for a page that is not advancing. Check `market.backlog_drain`, then whether the head of the backlog
        already has the data it is being fetched for — that is what an unsatisfiable view looks like.'
  - uid: muffin-verify-silent
    title: market-verify has not run
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: muffin-postgres
      model:
        refId: A
        format: table
        rawQuery: true
        rawSql: select case when max(sampled_at) < now() - interval '36 hours' or max(sampled_at) is null then 1 else 0 end as value from market.universe_sample where metric like 'verify.%'
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: Alerting
    execErrState: Alerting
    for: 1h
    labels:
      muffin: pipeline
    annotations:
      summary: '{{ $values.B }} backlog(s) have not moved in 24 hours'
      description: 'The nightly correctness gate runs in GitHub Actions and NOTHING notices when it silently does not. Measured 2026-08-28: the last run was 08-27 13:47 — 26 hours earlier — against a daily
        03:30 schedule. That is the same unreliability the warm-up was moved off (19 runs against 32 expected, gaps to 13.3 hours), and market-verify deliberately STAYS there because it must read as anon
        over HTTP: run inside the database it would bypass the anon key, RLS, grants, the 3-second anon timeout and PostgREST''s schema cache, which is the whole point of it.


        So it cannot be moved, and it can only be watched. This fires when no `verify.*` metric has been recorded for 36 hours — a whole missed night plus margin.


        RUNBOOK: `gh workflow run market-verify.yml --ref main`. If it passes on demand, GitHub dropped the schedule; if it fails, read the failing assertion.'
