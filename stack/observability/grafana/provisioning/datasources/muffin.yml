# Grafana datasources. Provisioned from a file so a rebuilt Grafana comes back configured.
#
# TWO DATASOURCES, AND THE SPLIT IS THE WHOLE DESIGN:
#
#   Prometheus  fast, high-cardinality, disposable — container memory, request latency, cache hits.
#   Postgres    slow, semantic, permanent — backlog depth, run outcomes, coverage of the universe.
#
# The Postgres one is why the domain metrics need no exporter at all. A dashboard panel is a SELECT.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: muffin-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Must match prometheus.yml's scrape_interval, or Grafana proposes `rate()` windows shorter
      # than the scrape and every rate panel renders empty for a reason nothing explains.
      timeInterval: 30s

  - name: Muffin Postgres
    uid: muffin-postgres
    # The MODERN plugin id. `postgres` still resolves (Grafana normalises it), but the API and every
    # doc example now use this one, and the config UI is written against it.
    type: grafana-postgresql-datasource
    access: proxy
    url: supabase-db:5432
    user: metrics_ro
    secureJsonData:
      # From the environment, never written into this file: the file is bind-mounted from the node
      # and a password in it would be readable by anything that can read the mount.
      password: $MUFFIN_METRICS_RO_PASSWORD
    jsonData:
      # THE DATABASE NAME BELONGS HERE, NOT AT THE TOP LEVEL, AND GETTING IT WRONG LOOKS LIKE A
      # BROKEN DASHBOARD WHILE EVERYTHING ACTUALLY WORKS. Grafana 11+ moved this setting into
      # jsonData; the deprecated top-level `database:` still CONNECTS — the health check answers
      # "Database Connection OK" and every panel returns rows — but the settings UI reads
      # jsonData.database for its form field, so the field renders EMPTY and the page asks you to
      # configure the database. Measured on Grafana 12.3.1: the datasource API reported
      # `database: postgres` at the top level and no `database` key in jsonData at all.
      #
      # It is not merely cosmetic. Anyone who opens that page and presses Save writes the empty
      # field back and takes every Postgres panel down — a working system one click from broken.
      # Verified before changing it, by creating a throwaway datasource carrying the name ONLY in
      # jsonData: its health check reached PASSWORD AUTHENTICATION, which it could not have done
      # without resolving the database first.
      database: postgres
      sslmode: disable          # same overlay network, never leaves the host
      postgresVersion: 1700
      # READ-ONLY, and enforced twice. `metrics_ro` has SELECT and nothing else (migration 127),
      # and this flag stops the query editor from offering anything that would need more. A
      # dashboard that can write to the database that runs the product is not a dashboard.
      timescaledb: false
