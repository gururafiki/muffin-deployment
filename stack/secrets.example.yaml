---
# Muffin stack — SECRETS only (API keys, passwords, tokens).
#
# Copy to `secrets.yaml` (gitignored via *secrets.yaml) and fill in. Loaded by `muffin_stack.yml`
# alongside config.yml. Non-secret deployment config (domain, registry, models, …) goes in
# config.yml — NOT here.

# === LLM / observability API keys (from your muffin-agent/.env) ===
openrouter_api_key: "<openrouter-or-openai-key>"
# openai_api_key:   "<only if different from openrouter_api_key>"
ollama_api_key: "<ollama-cloud-key>"        # required if llm_chain uses the "ollama" provider (ollama.com/settings/keys)
langsmith_api_key: "<lsv2_pt_...>"          # required — the LangGraph standalone server is licensed via LangSmith
langfuse_secret_key: "<sk-lf-...>"          # optional (tracing)
langfuse_public_key: "<pk-lf-...>"          # optional (tracing)

# === OpenBB provider keys (see the openbb-mcp-docker repo for the full list) ===
# OpenBB provider credentials. The env var is the provider's declared credential
# name upper-cased, which is NOT always *_API_KEY (tiingo -> TIINGO_TOKEN).
fmp_api_key: "<financialmodelingprep-key>"      # free tier; gates per SYMBOL on fundamentals
fred_api_key: "<fred-key>"                      # free — St Louis Fed
alpha_vantage_api_key: "<alpha-vantage-key>"    # free tier (rate limited)
tiingo_token: "<tiingo-token>"                  # free tier — NOTE: token, not api_key
biztoc_api_key: "<biztoc-rapidapi-key>"         # via RapidAPI
# Unset providers that would work if you add a key: bls, cftc_app_token,
# congress_gov, econdb, eia, nasdaq (free); benzinga, intrinio, tradier,
# tradingeconomics (paid). See todos.md for the full matrix.

# === Datastore secrets (generate: openssl rand -hex 16/32) ===
postgres_password: "<openssl rand -hex 16>"
firecrawl_postgres_password: "<openssl rand -hex 16>"
searxng_secret_key: "<openssl rand -hex 32>"

# === Supabase (generate all six with: stack/supabase/generate-keys.sh) ===
# jwt_secret signs every Supabase JWT; anon/service_role keys are long-lived JWTs
# DERIVED from it (regenerate them together, never independently).
supabase_db_password: "<from generate-keys.sh>"
supabase_jwt_secret: "<from generate-keys.sh>"
supabase_anon_key: "<from generate-keys.sh>"            # public client key (safe to ship in the app)
supabase_service_role_key: "<from generate-keys.sh>"    # ADMIN key — server-side only, never in clients
supabase_pg_meta_crypto_key: "<from generate-keys.sh>"  # postgres-meta/Studio connection-string encryption
supabase_secret_key_base: "<from generate-keys.sh>"     # Realtime (Phoenix) session key
supabase_realtime_db_enc_key: "<from generate-keys.sh>" # Realtime column encryption (exactly 16 chars)

# === SMTP (OPTIONAL) — ONE mailbox, two consumers =============================
# GoTrue sends signup/recovery mail; Grafana sends alerts. They are the same mailbox, so the
# canonical keys are the generic `smtp_*` below and `supabase_smtp_*` DEFAULTS to them (see
# docker-compose.yaml). Set only these unless GoTrue genuinely needs a different sender.
#
# Leave `smtp_host` empty and: signups auto-confirm without e-mail, and Grafana raises alerts on
# its dashboard but cannot mail them.
#
# Resend:              host smtp.resend.com, port 587, user "resend", pass = the API key.
# Cloudflare Email:    host smtp.mx.cloudflare.net, port 465, user "api_token",
#                      pass = a CF API token with Email Sending permission (domain onboarded).
smtp_host: ""
smtp_port: "587"
smtp_user: ""
smtp_pass: ""
smtp_from: ""                    # From: address (defaults to no-reply@<domain>)
smtp_sender_name: "Muffin"

# Where Grafana sends alerts. Comma-separated for several recipients. Empty = no alert mail.
alert_email_to: ""

# --- GoTrue overrides (OPTIONAL) ---------------------------------------------
# Each defaults to the matching `smtp_*` above. Set one ONLY to give auth mail a different
# sender or provider from alert mail; leaving them empty is the normal case.
supabase_smtp_host: ""
supabase_smtp_port: ""
supabase_smtp_user: ""
supabase_smtp_pass: ""
supabase_smtp_admin_email: ""
supabase_smtp_sender_name: ""

# === Observability ============================================================
# `metrics_ro` is the READ-ONLY Postgres role Grafana and postgres-exporter connect as. Migration
# 127 creates it NOLOGIN and passwordless (a migration is piped into psql with no variables, so a
# password cannot live there); Ansible grants it LOGIN with this. Empty = no metrics reader, and
# the role stays inert.
# NOT service_role: that is the ingest's admin key, and a dashboard is a reader.
metrics_ro_password: "<openssl rand -hex 16>"
# Grafana's own admin login (user: admin). Grafana is behind Cloudflare Access, so this is the
# second factor rather than the only one — but it is still a real password.
grafana_admin_password: "<openssl rand -hex 16>"

# === Supabase OAuth providers (OPTIONAL — leave empty to disable) ===
# Register an OAuth app on each provider with the callback
#   https://<supabase_subdomain>.<domain>/auth/v1/callback
# then paste its client id + secret here. See README "OAuth providers".
supabase_github_client_id: ""
supabase_github_secret: ""
supabase_google_client_id: ""
supabase_google_secret: ""

# === Cloudflare (Traefik DNS-01) ===
# Reuse the SAME token you put in terraform.tfvars (cloudflare_api_token) — it has Zone:DNS:Edit.
cf_dns_api_token: "<cloudflare-api-token>"

# === Container registry ===
# Leave empty if the GHCR packages are PUBLIC (the node pulls anonymously). Set a GitHub PAT
# (read:packages) only if you keep the packages private.
registry_password: ""
