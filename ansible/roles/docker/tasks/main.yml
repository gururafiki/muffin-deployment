---
- name: Update apt cache
  apt:
    update_cache: yes

- name: Install dependencies
  apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: yes

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker
  apt:
    name: docker-ce
    state: present

# `data-root` is MARKER-DRIVEN (roles/block_storage sets docker_data_root only when
# /mnt/data/docker/.migrated exists), so this playbook can never move the store by itself — it
# only follows a migration that already completed and verified itself. The default is
# /var/lib/docker, so a node that has not migrated renders exactly what it rendered before.
- name: Rotate container logs, and point Docker at the data volume once migrated
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "{{ docker_data_root | default('/var/lib/docker') }}",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    mode: "0644"
  notify: Restart Docker

- name: Add user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

