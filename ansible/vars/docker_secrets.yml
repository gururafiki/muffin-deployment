# Names of the Swarm secrets whose VALUE has to be able to change.
#
# A Swarm secret is immutable, and `Create Docker secrets` tolerates "already exists", so under a
# fixed name the first value ever created stays for good. Measured 2026-10-16: Traefik's
# `cf_dns_api_token` was created 2026-07-20 and never replaced. CLOUDFLARE_API_TOKEN was replaced
# on 2026-09-21, every deploy after that reported success, and Traefik kept the old token. Its
# DNS-01 renewals then failed with Cloudflare 401 every day from 2026-09-19, until the origin
# certificates were two days from expiry.
#
# Naming the secret by a hash of its value makes a new value a NEW secret, so the stack deploy
# points the service at it and restarts it. The container still reads
# /run/secrets/cf_dns_api_token: the mount target is the key in the stack file, not this name.
# Twelve hex characters of a SHA-256 reveal nothing usable about a token of this length.
#
# Loaded by the play that renders docker-compose.yaml AND by the play that creates the secrets.
# It is defined once because the two must agree, or the stack refers to a secret that does not exist.
cf_dns_secret_name: "cf_dns_api_token_{{ (cf_dns_api_token | hash('sha256'))[:12] }}"
