---
# Deploy the Muffin Agent stack to a single-node OCI Always-Free Swarm.
#
# You do not normally run this by hand — `terraform apply` runs it, via the
# `ansible/ansible` provider plus the `cloud.terraform` dynamic inventory, which
# reads the host straight out of Terraform state. There is no
# generate_inventory.sh.
#
# What it needs on the control machine, in stack/:
#   - config.yml    (cp config.example.yml — non-secret deploy config)
#   - secrets.yaml  (cp secrets.example.yaml — API keys / passwords / tokens)
# The service configs it stages are tracked in this repo under config/
# (opensandbox/, searxng/, firecrawl/) — nothing to copy in from muffin-agent,
# which is where they lived before 2026-06-21.
#
# Images come from the sibling repos' own CI (ghcr.io/gururafiki/*); this
# playbook builds nothing.
#
# To run it directly anyway (debugging a deploy):
#   cd terraform && terraform output -raw instance_public_ip
#   cd ../ansible && ansible-playbook -i <ip>, muffin_stack.yml -u ubuntu \
#       --private-key ~/.ssh/oci_key

# --- 1. Harden every node + open Swarm/ingress ports ----------------------
- hosts: all
  become: true
  gather_facts: true
  # Free disk before anything touches apt: old :latest image layers and logs
  # can fill the Always-Free boot volume and brick the whole run
  # ("No space left on device" from apt).
  pre_tasks:
    # A DEAD APT MIRROR LOOKS LIKE A TRANSIENT NETWORK FAULT AND IS PERMANENT.
    #
    # Oracle's cloud-init pins a REGIONAL Ubuntu mirror in the image
    # (uk-london-1-ad-3.clouds.ports.ubuntu.com). Canonical has since retired those names, so it
    # NXDOMAINs, `apt-get update` fails, and the very first role dies with
    # "Failed to update apt cache after 5 retries: " — a message with no cause in it, which reads
    # exactly like a flaky repo and is not. It killed two deploys on 2026-08-19 before anyone
    # looked at the node; the second was run purely because the first looked transient.
    #
    # Measured on the node: `uk-london-1-ad-3.clouds.ports.ubuntu.com` and the bare
    # `uk-london-1.clouds.ports.ubuntu.com` both NXDOMAIN, while `ports.ubuntu.com` resolves and
    # is already listed as a second entry in the same file. DNS itself is fine — download.docker.com
    # resolves — so this cannot be diagnosed by testing connectivity.
    #
    # Repaired here rather than in the image because it must hold for a REPLACED node too, and
    # because a mirror that resolves today can be retired tomorrow: the check is "does the
    # configured mirror resolve", not "is it the one hostname we know about".
    - name: Find apt mirrors that no longer resolve
      ansible.builtin.shell: |
        set -uo pipefail
        found=$(grep -rhoE "[A-Za-z0-9.-]+\.clouds\.ports\.ubuntu\.com" \
                  /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | sort -u || true)
        for h in $found; do
          getent hosts "$h" >/dev/null 2>&1 || echo "$h"
        done
      args:
        executable: /bin/bash
      register: dead_apt_mirrors
      changed_when: false
      check_mode: false

    - name: Repoint dead mirrors at the canonical ports.ubuntu.com
      # Idempotent by construction: after the rewrite the dead hostname is gone, so the detection
      # above returns nothing on the next run and this task does not fire. `grep -rl` finds the
      # files itself, which is why there is no path list to keep in sync and no `failed_when:
      # false` masking a real error — noble uses the deb822 `ubuntu.sources` and may have no
      # `sources.list` at all.
      ansible.builtin.shell: |
        set -uo pipefail
        for h in {{ dead_apt_mirrors.stdout_lines | map('quote') | join(' ') }}; do
          grep -rlF "$h" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sed -i "s|$h|ports.ubuntu.com|g"
        done
      args:
        executable: /bin/bash
      when: dead_apt_mirrors.stdout_lines | length > 0
      changed_when: true

    - name: Clear the apt package cache
      command: apt-get clean
      changed_when: true

    - name: Vacuum systemd journal down to 200M
      command: journalctl --vacuum-size=200M
      changed_when: true
      failed_when: false

    - name: Check whether Docker is installed yet
      command: which docker
      register: docker_bin
      changed_when: false
      failed_when: false

    - name: Prune unused Docker data (images, stopped containers, build cache — never volumes)
      command: docker system prune -af
      when: docker_bin.rc == 0
      changed_when: true
  roles:
    - oci-swarm-node
  vars:
    ufw_tcp_ports:
      - 22    # SSH
      - 80    # Traefik HTTP (redirects to 443)
      - 443   # Traefik HTTPS
      - 7946  # Docker Swarm
      - 4789  # Docker Swarm
      - 2377  # Docker Swarm
    ufw_udp_ports:
      - 22    # SSH
      - 7946  # Docker Swarm
      - 4789  # Docker Swarm
      - 2377  # Docker Swarm
    ssh_permit_root_login: "no"

# --- 2. Form the Swarm ----------------------------------------------------
- hosts: manager
  become: true
  roles:
    - swarm_manager

- hosts: workers
  become: true
  roles:
    - swarm_worker

# --- 3. Stage config + env files onto the manager -------------------------
- name: Stage Muffin runtime files
  hosts: manager
  become: true
  vars:
    muffin_template_dir: ../stack
  tasks:
    - name: Load non-secret config
      include_vars:
        file: "{{ muffin_template_dir }}/config.yml"

    - name: Load secrets
      include_vars:
        file: "{{ muffin_template_dir }}/secrets.yaml"

    - name: Stage opensandbox config.toml
      copy:
        src: "../config/opensandbox/config.toml"
        dest: /home/ubuntu/config.toml

    - name: Stage SearxNG settings directory
      copy:
        src: "../config/searxng/"
        dest: /home/ubuntu/searxng/

    - name: Render Traefik static config
      template:
        src: "{{ muffin_template_dir }}/traefik.yml"
        dest: /home/ubuntu/traefik.yml

    - name: Stage Supabase db init scripts (verbatim upstream; run on first db boot only)
      copy:
        src: "{{ muffin_template_dir }}/supabase/db/"
        dest: /home/ubuntu/supabase/db/

    - name: Render Supabase Kong declarative config
      template:
        src: "{{ muffin_template_dir }}/supabase/kong.yml"
        # World-readable like the rendered compose file (Kong runs as a non-root
        # user in-container and must be able to read it).
        dest: /home/ubuntu/supabase/kong.yml
        mode: "0644"

    - name: Stage Supabase app migrations (idempotent; applied post-deploy below)
      copy:
        src: "{{ muffin_template_dir }}/supabase/migrations/"
        dest: /home/ubuntu/supabase/migrations/

    - name: Stage Supabase edge-function sources (main/ is the upstream router)
      copy:
        src: "{{ muffin_template_dir }}/supabase/functions/"
        dest: /home/ubuntu/supabase/functions/

    - name: Render the Swarm stack file
      template:
        src: "{{ muffin_template_dir }}/docker-compose.yaml"
        dest: /home/ubuntu/docker-compose.yaml

# --- 4. Registry login + Docker secrets -----------------------------------
- name: Prepare registry auth and Docker secrets
  hosts: manager
  become: true
  vars:
    muffin_template_dir: ../stack
  tasks:
    - name: Load non-secret config
      include_vars:
        file: "{{ muffin_template_dir }}/config.yml"

    - name: Load secrets
      include_vars:
        file: "{{ muffin_template_dir }}/secrets.yaml"

    # All ghcr.io/gururafiki/* images are PUBLIC, so the node pulls them
    # anonymously — no registry login, and NO --with-registry-auth on the stack
    # deploy below. Actively CLEAR any stale ghcr.io credential (e.g. left by an
    # earlier login with a since-rotated REGISTRY_PASSWORD): a bad/expired
    # credential makes the registry return 401 instead of falling back to
    # anonymous, which breaks pulls of even public images ("No such image:
    # ghcr.io/..."). If images are ever made private, restore a `docker login`
    # here + `--with-registry-auth` below with a valid PAT.
    - name: Clear any stale registry credential (images are public → anonymous pulls)
      command: "docker logout {{ registry_server }}"
      changed_when: false
      failed_when: false

    - name: Create Docker secrets (idempotent)
      shell: "echo -n {{ item.value | quote }} | docker secret create {{ item.name }} -"
      no_log: true
      register: secret_create
      changed_when: "'already exists' not in (secret_create.stderr | default(''))"
      failed_when:
        - secret_create.rc != 0
        - "'already exists' not in (secret_create.stderr | default(''))"
      loop:
        - { name: "postgres_password", value: "{{ postgres_password }}" }
        - { name: "firecrawl_postgres_password", value: "{{ firecrawl_postgres_password }}" }
        - { name: "cf_dns_api_token", value: "{{ cf_dns_api_token }}" }
      loop_control:
        label: "{{ item.name }}"

# --- 5. Deploy the stack --------------------------------------------------
- name: Deploy the Muffin stack
  hosts: manager
  become: true
  tasks:
    # Swarm's service executor can fail to pull PUBLIC images anonymously (no
    # --with-registry-auth), reporting "No such image: ghcr.io/..." even though a
    # plain `docker pull` on the node works — and 7 concurrent anonymous pulls can
    # also hit GHCR throttling. Pre-pull every stack image to the local daemon
    # SERIALLY, so the deploy only has to start containers, never pull them.
    - name: Pre-pull all stack images (serial; public, avoids the swarm pull quirk)
      shell: |
        awk '/^[[:space:]]*image:/ {gsub(/"/,"",$2); print $2}' /home/ubuntu/docker-compose.yaml \
          | sort -u | while read -r img; do echo "pull $img"; docker pull "$img" || true; done
      changed_when: true

    - name: docker stack deploy (images are public → anonymous pulls, no registry auth)
      command: "docker stack deploy -c /home/ubuntu/docker-compose.yaml muffin"

# --- 6. Supabase post-deploy migrations ------------------------------------
# App tables reference auth.users, which GoTrue creates on ITS first boot — so these
# run after the stack is up, waiting for GoTrue's migrations, and are idempotent
# (safe to re-run on every deploy).
- name: Apply Supabase app migrations
  hosts: manager
  become: true
  tasks:
    - name: Wait for supabase-db to be ready
      shell: >
        docker exec "$(docker ps -qf name=muffin_supabase-db | head -1)"
        pg_isready -U postgres -h localhost
      register: db_ready
      until: db_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for GoTrue to have created the auth schema
      shell: >
        docker exec "$(docker ps -qf name=muffin_supabase-db | head -1)"
        psql -U postgres -tAc "SELECT 1 FROM information_schema.tables
        WHERE table_schema='auth' AND table_name='users'"
      register: auth_ready
      until: auth_ready.stdout is search('1')
      retries: 30
      delay: 10
      changed_when: false

    # LangGraph uses the Supabase `postgres` database directly (use_supabase_db)
    # and keeps its tables in `public` — where langgraph-api naturally creates and
    # finds them: it connects as `postgres` on the DEFAULT search_path, does NOT
    # honour a client-side PGOPTIONS, and recreates its tables in public whenever
    # they're missing. Because it's the same `postgres` database Studio is pinned
    # to, LangGraph's tables are browsable in Studio. A dedicated `langgraph`
    # schema was attempted and abandoned (langgraph-api kept recreating tables in
    # public → 500s + duplicate tables); a robust namespaced setup would need the
    # role search_path baked into a supabase-db init script that runs BEFORE
    # langgraph-api's first connection (see README). This drop cleans up any stale
    # schema left by that attempt; idempotent (langgraph-api never recreates it).
    - name: Drop the abandoned langgraph schema (LangGraph uses public in the postgres DB)
      shell: >
        docker exec "$(docker ps -qf name=muffin_supabase-db | head -1)"
        psql -U postgres -d postgres -v ON_ERROR_STOP=1
        -c "DROP SCHEMA IF EXISTS langgraph CASCADE"
      changed_when: false
      when: use_supabase_db | default(false)

    - name: Apply idempotent app migrations (tables + RLS)
      shell: >
        docker exec -i "$(docker ps -qf name=muffin_supabase-db | head -1)"
        psql -U postgres --single-transaction -v ON_ERROR_STOP=1 -d postgres
        < "/home/ubuntu/supabase/migrations/{{ item | basename }}"
      # `--single-transaction` because psql otherwise AUTOCOMMITS EACH STATEMENT, and two
      # consequences of that both bit today:
      #
      #   1. Migration 35 drops the serving views before recreating them (it discovers dependents
      #      via pg_depend). Autocommitted, that leaves a window where they do not exist, and every
      #      reader in it fails — `price_series` 42P01, `pending_performance.fetch_symbol does not
      #      exist`, and a `fund_sector_weight` statement timeout, all chased as bugs before being
      #      recognised as a deploy in progress.
      #   2. A migration that fails PART WAY leaves its earlier statements committed. That is how
      #      migration 38's failure left production without `pending_prices` — 35 had already
      #      dropped it and 38 died before anything recreated it.
      #
      # Verified before enabling: the whole set applies three times under --single-transaction and
      # all seven behaviour tests pass. Migration 39 carries its own begin/commit for a temp-table
      # rekey; under this flag its inner commit simply ends the outer transaction early, which is no
      # worse than the autocommit it has always had.
      #
      # `with_fileglob` does NOT sort — it returns Python glob order, which is
      # filesystem order. Measured 2026-08-09: the migrations ran 04, 01, 05, 02, 03,
      # so 04/05 hit a `market` schema that 02 had not created yet and the deploy
      # failed. The numeric prefixes only mean anything if this is sorted.
      loop: "{{ query('fileglob', playbook_dir + '/../stack/supabase/migrations/*.sql') | sort }}"
      loop_control:
        label: "{{ item | basename }}"
      changed_when: true

    # A new table is INVISIBLE over the API until PostgREST rebuilds its schema
    # cache. Every migration ends with `notify pgrst, 'reload schema'`, but that
    # proved unreliable here — 10-reference-model.sql's tables 404'd as PGRST205
    # after two consecutive deploys. Earlier migrations only ever appeared because
    # their deploy happened to change supabase-rest's config and restart it, which
    # hid the problem.
    #
    # SIGUSR1 is PostgREST's documented "reload the schema cache" signal: no
    # restart, no dropped connections, and it does not depend on LISTEN/NOTIFY
    # having survived. Idempotent and harmless when nothing changed.
    - name: Reload PostgREST's schema cache (SIGUSR1) so new tables are visible
      shell: >
        docker kill -s SIGUSR1 "$(docker ps -qf name=muffin_supabase-rest | head -1)"
      changed_when: false
      failed_when: false

# --- 6. Nightly database backups (pg_dumpall -> OCI Object Storage) --------
- name: Configure database backups
  hosts: manager
  become: true
  vars:
    muffin_template_dir: ../stack
  tasks:
    - name: Load non-secret config
      include_vars:
        file: "{{ muffin_template_dir }}/config.yml"

    # The S3 Customer Secret Keys are the same ones the tfstate backend uses —
    # already in the deploy env as AWS_ACCESS_KEY_ID/SECRET (see deploy.yml). Read
    # them here and stage a root-only env file so the cron uploads with no new
    # secret. If they're absent (e.g. a local run without S3 creds), skip backups.
    - name: Detect S3 credentials in the deploy environment
      set_fact:
        _s3_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        _s3_secret: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
      no_log: true

    - name: Note when backups are skipped (no S3 credentials)
      debug:
        msg: "DB backups skipped: AWS_ACCESS_KEY_ID not in the deploy environment."
      when: (db_backups_enabled | default(true)) and (_s3_key | length == 0)

    - name: Configure nightly supabase-db backups
      when: (db_backups_enabled | default(true)) and (_s3_key | length > 0)
      block:
        - name: Ensure /etc/muffin exists
          file:
            path: /etc/muffin
            state: directory
            mode: "0700"

        - name: Stage the S3 credentials (root-only)
          copy:
            dest: /etc/muffin/backup.env
            mode: "0600"
            content: |
              AWS_ACCESS_KEY_ID={{ _s3_key }}
              AWS_SECRET_ACCESS_KEY={{ _s3_secret }}
              AWS_REQUEST_CHECKSUM_CALCULATION=when_required
              AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          no_log: true

        - name: Stage the backup script
          template:
            src: "{{ muffin_template_dir }}/muffin-db-backup.sh"
            dest: /usr/local/bin/muffin-db-backup.sh
            mode: "0755"

        # Operator tool, NOT cron: deletes one thread + its checkpoints. Staged
        # here so it is available on the node when a single bad thread dominates
        # checkpoint storage (see its header). Dry-run unless given --yes.
        - name: Stage the thread-prune tool
          copy:
            src: "{{ muffin_template_dir }}/muffin-prune-thread.sh"
            dest: /usr/local/bin/muffin-prune-thread.sh
            mode: "0755"

        - name: Install the nightly backup cron (03:00 UTC)
          cron:
            name: muffin-db-backup
            minute: "0"
            hour: "3"
            user: root
            job: "/usr/local/bin/muffin-db-backup.sh >> /var/log/muffin-db-backup.log 2>&1"

        # Fire-and-forget (poll: 0) so it NEVER holds or severs the deploy's SSH
        # session — a synchronous run once starved the node and knocked services
        # to 0/1. It also runs niced + checkpoint-light now; verify the object
        # landed with `oci os object list --bucket-name muffin-db-backups`.
        - name: Seed one backup now (async)
          command: /usr/local/bin/muffin-db-backup.sh
          async: 900
          poll: 0
          changed_when: true
